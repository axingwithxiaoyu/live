<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的小世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            color: #7b4157;
            padding: 30px 15px;
            position: relative;
            min-height: 100vh;
        }
        /* ========== 淡粉梦幻星空渐变背景 ========== */
        .starry-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(140deg, #ffe8f0 0%, #ffd8e8 30%, #fce4f2 60%, #fff0f6 100%);
        }
        /* 点点星光 */
        .star-dot {
            position: absolute;
            border-radius: 50%;
            background-color: #ffffff;
            opacity: 0.6;
            animation: twinkle 3s ease‑in‑out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 0.9; transform: scale(1.1); }
        }
        /* 流星层 */
        .meteor-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .meteor {
            position: absolute;
            top: -10%;
            width: 2px;
            height: 80px;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, #fff 50%, rgba(255,255,255,0) 100%);
            filter: drop-shadow(0 0 8px #ffcce0);
            animation: meteor linear infinite;
            opacity: 0;
        }
        @keyframes meteor {
            0% {
                transform: translateY(-100px) translateX(0) rotate(210deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) translateX(-220px) rotate(210deg);
                opacity: 0;
            }
        }
        /* ==========新增：粉色花瓣飘落 ========== */
        .petal-wrap{
            position: fixed;
            inset:0;
            z-index:-1;
            pointer-events:none;
            overflow:hidden;
        }
        .petal{
            position:absolute;
            top:-10%;
            width:14px;
            height:14px;
            background:#ffc8d8;
            border-radius: 0 50% 50% 50%;
            opacity:0.75;
            animation:petalFall linear infinite, petalRotate ease-in-out infinite;
        }
        @keyframes petalFall{
            0%{transform:translateX(0) translateY(-50px);opacity:0;}
            10%{opacity:0.8;}
            100%{transform:translateX(80px) translateY(110vh);opacity:0;}
        }
        @keyframes petalRotate{
            0%{transform:rotate(0deg);}
            100%{transform:rotate(360deg);}
        }
        /* =========鼠标跟随爱心特效========= */
        .heart-follow{
            position:fixed;
            pointer-events:none;
            z-index:99;
            font-size:18px;
            color:#ff88aa;
            opacity:0;
            animation:heartFloat 1.2s ease-out forwards;
        }
        @keyframes heartFloat{
            0%{opacity:0.8; transform:translateY(0) scale(1);}
            100%{opacity:0; transform:translateY(-60px) scale(0.4);}
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 12px;
        }
        .tip {
            font-size: 16px;
            color: #b0748c;
            margin-bottom: 20px;
        }
        .count-box {
            display: inline-block;
            background: #ffe6ee;
            padding: 16px 28px;
            border-radius: 999px;
            font-size: 20px;
        }

        /* =========分类标签tab========= */
        .tab-wrap{
            display:flex;
            gap:12px;
            flex-wrap:wrap;
            justify-content:center;
            margin-bottom:30px;
        }
        .tab-btn{
            padding:8px 20px;
            border-radius:30px;
            border:2px solid #ffc8d8;
            background:#fff;
            color:#7b4157;
            cursor:pointer;
            font-size:16px;
            transition:0.2s;
        }
        .tab-btn.active{
            background:#ff88aa;
            color:#fff;
            border-color:#ff88aa;
        }
        .tab-btn:hover:not(.active){
            background:#ffe6ee;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom:50px;
        }
        /* ==========柔和甜品相框 内部装饰，不外凸========== */
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            background: #fff;
            border: 2px solid;
            border-image: linear-gradient(135deg,#ffd6e4,#ffe8ef,#ffd6e4) 1;
            box-shadow: 0 4px 14px rgba(123, 65, 87, 0.08);
            cursor: pointer;
            min-height: 200px;
            padding: 10px;
        }
        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius:10px;
            transition: transform 0.4s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.03);
        }
        /* 内部角落甜品装饰，半透明，微弱浮动 */
        .gallery-item .dec {
            position:absolute;
            font-size:20px;
            opacity:0.5;
            pointer-events:none;
            z-index:2;
            animation:decFloat 4s ease-in-out infinite alternate;
        }
        @keyframes decFloat {
            0%{transform:translateY(0px);}
            100%{transform:translateY(-3px);}
        }
        .dec-tl { top:6px; left:8px; }
        .dec-tr { top:6px; right:8px; }
        .dec-bl { bottom:6px; left:8px; }
        .dec-br { bottom:6px; right:8px; }

        /* ============留言墙============ */
        .note-wall{
            margin:60px 0;
        }
        .block-title{
            text-align:center;
            font-size:24px;
            margin-bottom:32px;
            color:#7b4157;
        }
        .note-input-area{
            max-width:600px;
            margin:0 auto 30px;
            background:#fff;
            padding:20px;
            border-radius:14px;
            box-shadow:0 3px 12px rgba(123, 65, 87, 0.08);
        }
        #noteTextarea{
            width:100%;
            min-height:80px;
            padding:12px;
            border:1px solid #ffd6e4;
            border-radius:8px;
            resize:vertical;
            font-size:15px;
        }
        .note-btn-row{
            margin-top:12px;
            text-align:right;
        }
        #addNoteBtn{
            padding:8px 22px;
            background:#ff88aa;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:15px;
        }
        #addNoteBtn:hover{
            background:#ff6b98;
        }
        .note-container{
            display:flex;
            flex-wrap:wrap;
            gap:18px;
            justify-content:center;
        }
        .note{
            width:180px;
            padding:16px 14px;
            border-radius:6px;
            box-shadow:2px 3px 8px rgba(0,0,0,0.12);
            transform:rotate(var(--r));
            transition:transform 0.25s ease;
            cursor:default;
            position:relative;
        }
        .note:hover{
            transform:rotate(0deg) scale(1.05);
            z-index:2;
        }
        .note-del{
            position:absolute;
            top:4px;
            right:6px;
            font-size:14px;
            cursor:pointer;
            opacity:0.4;
        }
        .note:hover .note-del{
            opacity:1;
        }
        .note-1{background:#fff8bc; --r:-2deg;}
        .note-2{background:#ffddee; --r:2deg;}
        .note-3{background:#dcf6ff; --r:-1.5deg;}
        .note-4{background:#ffe9cc; --r:1.8deg;}
        .note-text{
            font-size:15px;
            line-height:1.6;
        }

        .words {
            margin-top: 40px;
            padding: 24px;
            background: #fff;
            border-radius: 16px;
            line-height: 1.8;
            font-size: 17px;
        }
        footer {
            margin-top: 40px;
            text-align: center;
            color: #c2889f;
        }
        /* 音乐面板｜无歌名｜按钮一行，音量下一行 */
        .audio-panel{
            position: fixed;
            top:20px;
            right:20px;
            background:#ffe6ee;
            padding:14px 16px;
            border-radius:18px;
            box-shadow:0 3px 8px rgba(0,0,0,0.1);
            z-index:10;
            display:flex;
            flex-direction:column;
            gap:12px;
        }
        .btn-row{
            display:flex;
            gap:10px;
            align-items:center;
        }
        .audio-icon{
            width:36px;
            height:36px;
            border:none;
            border-radius:50%;
            background:#ffffff;
            color:#7b4157;
            font-size:16px;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            box-shadow:0 2px 5px rgba(0,0,0,0.06);
        }
        .audio-icon:hover{
            background:#f8d2e0;
        }
        .play-main{
            width:42px;
            height:42px;
            background:#ff78a2;
            color:#fff;
        }
        .play-main:hover{
            background:#ff588c;
        }
        .volume-wrap{
            display:flex;
            align-items:center;
            gap:6px;
        }
        .volume-wrap input{
            width:110px;
        }
        .lightbox{
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.85);
            z-index:999;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        .lightbox.show{
            display:flex;
        }
        .lightbox img{
            max-width:90%;
            max-height:90vh;
            border-radius:12px;
            animation:fade 0.35s ease;
        }
        @keyframes fade{
            from{opacity:0;transform:scale(0.92)}
            to{opacity:1;transform:scale(1)}
        }
        .lightbox-close{
            position:absolute;
            top:24px;
            right:30px;
            color:white;
            font-size:36px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <!-- 粉色星空背景层 -->
    <div class="starry-bg" id="starryBg"></div>
    <!-- 流星动画层 -->
    <div class="meteor-bg" id="meteorBg"></div>
    <!-- 花瓣飘落层 -->
    <div class="petal-wrap" id="petalWrap"></div>

    <div class="container">
        <div class="header">
            <h1>💌 我们的回忆相册</h1>
            <div class="tip">从相爱那天起，已经一起走过</div>
            <div class="count-box" id="count">计算中...</div>
        </div>

        <!-- 分类标签 -->
        <div class="tab-wrap" id="tabWrap">
            <button class="tab-btn active" data-filter="all">全部</button>
            <button class="tab-btn" data-filter="我的世界">我的世界</button>
            <button class="tab-btn" data-filter="第五人格">第五人格</button>
            <button class="tab-btn" data-filter="其他">其他</button>
        </div>

        <!-- 网格照片墙 -->
        <div class="gallery" id="galleryBox">
        </div>

        <!-- =====留言墙===== -->
        <section class="note-wall">
            <h2 class="block-title">💛 留言墙</h2>
            <div class="note-input-area">
                <textarea id="noteTextarea" placeholder="在这里写下你的悄悄话，提交生成便签（仅保存在本机浏览器）"></textarea>
                <div class="note-btn-row">
                    <button id="addNoteBtn">添加便签</button>
                </div>
            </div>
            <div class="note-container" id="noteBox">
            </div>
        </section>

        <div class="words">
            ✨ 写给我们：<br>
            很高兴和你相遇，
            所有细碎、温柔的瞬间，
            都值得好好收藏。
            往后日子，慢慢一起走。
        </div>
        <footer>
            Axing with Xiaoyu
        </footer>
    </div>

    <div class="lightbox" id="lightbox">
        <span class="lightbox-close">&times;</span>
        <img id="lightImg" src="" alt="大图">
    </div>

    <!-- 音乐控制面板｜无歌名｜按钮一行，音量下一行 -->
    <div class="audio-panel">
        <div class="btn-row">
            <button class="audio-icon" id="prevBtn" title="上一首">⏮</button>
            <button class="audio-icon play-main" id="musicBtn" title="播放/暂停">▶</button>
            <button class="audio-icon" id="nextBtn" title="下一首">⏭</button>
        </div>
        <div class="volume-wrap">
            <span>🔊</span>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.7">
        </div>
    </div>
    <audio id="bgMusic" preload="auto">

    <script>
        // ========== 配置区 ==========
        //纪念日 月份从0开始！7=8月
        const startYear = 2026;
        const startMonth = 7;
        const startDay = 28;
        //甜品emoji库
        const sweetEmojis = ["🍰","🍦","🍬","🍩","🧁","🍭"];

        //========【图片配置：在这里设置图片路径和标签】========
        //tags可填："我的世界"、"第五人格"、"其他"，一张图可以多个标签例如 tags:["我的世界","第五人格"]
        const photoData = [
            {src:"img/1.jpg", tags:["我的世界"]},
            {src:"img/2.jpg", tags:["我的世界"]},
            {src:"img/3.jpg", tags:["我的世界"]},
            {src:"img/4.jpg", tags:["我的世界"]},
            {src:"img/5.jpg", tags:["我的世界"]},
            {src:"img/6.jpg", tags:["我的世界"]},
            {src:"img/7.jpg", tags:["我的世界"]},
            {src:"img/8.jpg", tags:["我的世界"]},
            {src:"img/9.jpg", tags:["我的世界"]},
            {src:"img/10.jpg", tags:["我的世界"]},
            {src:"img/11.jpg", tags:["我的世界"]},
            {src:"img/12.jpg", tags:["第五人格"]},
            {src:"img/13.jpg", tags:["第五人格"]},
            {src:"img/14.jpg", tags:["第五人格"]},
            {src:"img/15.jpg", tags:["第五人格"]},
            {src:"img/16.jpg", tags:["第五人格"]},
            {src:"img/17.jpg", tags:["第五人格"]}
        ];

        //========【内置静态便签】========
        const staticNoteData = [
            { cls:"note-1", content:"和你在一起的每一天都很珍贵。" },
            { cls:"note-2", content:"希望岁岁年年，身边一直是你。" },
            { cls:"note-3", content:"难过的时候，有你就很安心。" },
            { cls:"note-4", content:"期待我们更多的未来故事✨" }
        ];

        // =========【歌单配置在这里】=========
        const songList = [
            {filePath:"bg1.mp3", showName:"歌曲1"},
            {filePath:"bg2.mp3", showName:"歌曲2"},
            {filePath:"bg3.mp3", showName:"歌曲3"}
        ];
        let currentSongIndex = 0;

        // 当前选中筛选标签
        let currentFilter = "all";

        // 用户新增便签存在localStorage
        let userNotes = JSON.parse(localStorage.getItem("loveNotes")) || [];

        //保存用户便签到浏览器本地
        function saveUserNotes(){
            localStorage.setItem("loveNotes", JSON.stringify(userNotes));
        }

        //渲染全部便签：静态 + 用户新增
        function renderAllNotes(){
            const noteBox = document.getElementById("noteBox");
            noteBox.innerHTML = "";
            //渲染固定写死便签
            staticNoteData.forEach(n=>{
                const div = document.createElement("div");
                div.className = "note " + n.cls;
                div.innerHTML = `<div class="note-text">${n.content}</div>`;
                noteBox.appendChild(div);
            });
            //渲染用户写的便签
            userNotes.forEach((item,idx)=>{
                const div = document.createElement("div");
                div.className = "note " + item.cls;
                div.innerHTML = `
                    <span class="note-del" data-idx="${idx}">✕</span>
                    <div class="note-text">${item.content}</div>
                `;
                noteBox.appendChild(div);
            })
            //绑定删除事件
            document.querySelectorAll(".note-del").forEach(el=>{
                el.onclick = function(e){
                    e.stopPropagation();
                    const i = Number(this.dataset.idx);
                    userNotes.splice(i,1);
                    saveUserNotes();
                    renderAllNotes();
                }
            })
        }

        // 添加新便签按钮逻辑
        document.getElementById("addNoteBtn").onclick = function(){
            const textarea = document.getElementById("noteTextarea");
            const txt = textarea.value.trim();
            if(!txt) return;
            const clsList = ["note-1","note-2","note-3","note-4"];
            const randomCls = clsList[Math.floor(Math.random()*clsList.length)];
            userNotes.push({cls:randomCls, content:txt});
            saveUserNotes();
            renderAllNotes();
            textarea.value = "";
        }

        // 计算在一起天数
        function calcDay() {
            const start = Date.UTC(startYear, startMonth, startDay);
            const now = new Date();
            const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
            const diffMs = today - start;
            const diffDays = diffMs / (1000 * 60 * 60 * 24);
            const days = Math.floor(diffDays);
            document.getElementById("count").innerText = `❤️ ${days} 天`;
        }
        calcDay();

        //渲染照片墙 根据filter过滤
        function renderGallery(filterKey){
            const galleryBox = document.getElementById('galleryBox');
            galleryBox.innerHTML = "";
            let showList = [];
            if(filterKey === "all"){
                showList = [...photoData];
            }else{
                showList = photoData.filter(p=> p.tags.includes(filterKey));
            }

            showList.forEach((photo,idx)=>{
                const itemDiv = document.createElement('div');
                itemDiv.className = 'gallery-item';
                const t1 = document.createElement('span');
                t1.className="dec dec-tl";
                t1.innerText = sweetEmojis[(idx+0) % sweetEmojis.length];
                const t2 = document.createElement('span');
                t2.className="dec dec-tr";
                t2.innerText = sweetEmojis[(idx+2) % sweetEmojis.length];
                const b1 = document.createElement('span');
                b1.className="dec dec-bl";
                b1.innerText = sweetEmojis[(idx+1) % sweetEmojis.length];
                const b2 = document.createElement('span');
                b2.className="dec dec-br";
                b2.innerText = sweetEmojis[(idx+3) % sweetEmojis.length];
                const img = document.createElement('img');
                img.src = photo.src;
                img.alt = "合照";
                itemDiv.append(t1,t2,b1,b2,img);
                galleryBox.appendChild(itemDiv);
                img.onclick = ()=>{
                    lightImg.src = photo.src;
                    lightbox.classList.add('show');
                }
            })
        }

        //标签点击事件
        document.querySelectorAll(".tab-btn").forEach(btn=>{
            btn.onclick = function(){
                document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
                this.classList.add("active");
                currentFilter = this.dataset.filter;
                renderGallery(currentFilter);
            }
        })

        //页面初始化渲染
        renderGallery(currentFilter);
        renderAllNotes();

        // =========鼠标跟随爱心特效========
        document.addEventListener('mousemove',(e)=>{
            if(Math.random()>0.85){
                const heart = document.createElement('div');
                heart.className = "heart-follow";
                heart.innerText = "♥";
                heart.style.left = e.clientX + "px";
                heart.style.top = e.clientY + "px";
                document.body.appendChild(heart);
                setTimeout(()=>heart.remove(),1200);
            }
        })

        // =========音乐控制逻辑========
        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        music.volume = volumeSlider.value;
        function loadSong(index){
            const song = songList[index];
            music.src = "music/" + song.filePath;
        }
        loadSong(currentSongIndex);
        musicBtn.onclick = ()=>{
            if(music.paused){
                music.play();
                musicBtn.innerText = "⏸";
            }else{
                music.pause();
                musicBtn.innerText = "▶";
            }
        }
        prevBtn.onclick = ()=>{
            currentSongIndex--;
            if(currentSongIndex < 0) currentSongIndex = songList.length -1;
            loadSong(currentSongIndex);
            music.play();
            musicBtn.innerText = "⏸";
        }
        nextBtn.onclick = ()=>{
            currentSongIndex++;
            if(currentSongIndex >= songList.length) currentSongIndex = 0;
            loadSong(currentSongIndex);
            music.play();
            musicBtn.innerText = "⏸";
        }
        music.onended = function(){
            currentSongIndex++;
            if(currentSongIndex >= songList.length) currentSongIndex = 0;
            loadSong(currentSongIndex);
            music.play();
            musicBtn.innerText = "⏸";
        }
        volumeSlider.oninput = function(){
            music.volume = this.value;
        }

        //图片弹窗关闭
        const lightbox = document.getElementById('lightbox');
        const lightImg = document.getElementById('lightImg');
        const closeBtn = document.querySelector('.lightbox-close');
        closeBtn.onclick = ()=> lightbox.classList.remove('show');
        lightbox.onclick = (e)=>{
            if(e.target === lightbox) lightbox.classList.remove('show');
        }

        // ========== 生成闪烁星星 ==========
        const starryBg = document.getElementById('starryBg');
        const starCount = 60;
        for(let i=0;i<starCount;i++){
            const star = document.createElement('div');
            star.className = 'star-dot';
            star.style.left = Math.random()*100 + '%';
            star.style.top = Math.random()*100 + '%';
            star.style.width = (Math.random()*3+1)+'px';
            star.style.height = star.style.width;
            star.style.animationDelay = (Math.random()*3)+'s';
            starryBg.appendChild(star);
        }
        // ========== 生成流星 ==========
        const meteorBg = document.getElementById('meteorBg');
        const meteorCount = 10;
        for (let i = 0; i < meteorCount; i++) {
            const meteor = document.createElement('div');
            meteor.className = 'meteor';
            meteor.style.left = Math.random() * 100 + '%';
            meteor.style.animationDuration = (Math.random() * 2 + 2) + 's';
            meteor.style.animationDelay = (Math.random() * 4) + 's';
            meteor.style.height = (Math.random() * 40 + 60) + 'px';
            meteorBg.appendChild(meteor);
        }
        // ==========生成花瓣飘落==========
