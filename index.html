<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时光相册</title>
    <!-- Supabase SDK：GitHub Pages 备用站的共享后端（加载失败不影响 EdgeOne 版） -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            color: #7b4157;
            padding: 30px 15px 100px;
            position: relative;
            min-height: 100vh;
        }
        /* 手机端：底部预留空间给导航栏 */
        @media (max-width: 600px){
            body{
                padding-top: 30px;
                padding-bottom: 100px;
            }
        }
        /* ========== 淡粉梦幻星空渐变背景 ========== */
        .starry-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(140deg, #ffe8f0 0%, #ffd8e8 30%, #fce4f2 60%, #fff0f6 100%);
        }
        .star-dot {
            position: absolute;
            border-radius: 50%;
            background-color: #ffffff;
            opacity: 0.6;
            animation: twinkle 3s ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 0.9; transform: scale(1.1); }
        }
        .meteor-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .meteor {
            position: absolute;
            top: -10%;
            width: 2px;
            height: 80px;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, #fff 50%, rgba(255,255,255,0) 100%);
            filter: drop-shadow(0 0 8px #ffcce0);
            animation: meteor linear infinite;
            opacity: 0;
        }
        @keyframes meteor {
            0% {
                transform: translateY(-100px) translateX(0) rotate(210deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) translateX(-220px) rotate(210deg);
                opacity: 0;
            }
        }
        .petal-wrap{
            position: fixed;
            inset:0;
            z-index:-1;
            pointer-events:none;
            overflow:hidden;
        }
        .petal{
            position:absolute;
            top:-10%;
            width:14px;
            height:14px;
            background:#ffc8d8;
            border-radius: 0 50% 50% 50%;
            opacity:0.75;
            animation:petalFall linear infinite, petalRotate ease-in-out infinite;
        }
        @keyframes petalFall{
            0%{transform:translateX(0) translateY(-50px);opacity:0;}
            10%{opacity:0.8;}
            100%{transform:translateX(80px) translateY(110vh);opacity:0;}
        }
        @keyframes petalRotate{
            0%{transform:rotate(0deg);}
            100%{transform:rotate(360deg);}
        }
        .heart-follow{
            position:fixed;
            pointer-events:none;
            z-index:99;
            font-size:18px;
            color:#ff88aa;
            opacity:0;
            animation:heartFloat 1.2s ease-out forwards;
        }
        @keyframes heartFloat{
            0%{opacity:0.8; transform:translateY(0) scale(1);}
            100%{opacity:0; transform:translateY(-60px) scale(0.4);}
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 12px;
        }
        .tip {
            font-size: 16px;
            color: #b0748c;
            margin-bottom: 20px;
        }
        .count-box {
            display: inline-block;
            background: #ffe6ee;
            padding: 16px 28px;
            border-radius: 999px;
            font-size: 20px;
        }
        .tab-wrap{
            display:flex;
            gap:12px;
            flex-wrap:wrap;
            justify-content:center;
            margin-bottom:30px;
        }
        .tab-btn{
            padding:8px 20px;
            border-radius:30px;
            border:2px solid #ffc8d8;
            background:#fff;
            color:#7b4157;
            cursor:pointer;
            font-size:16px;
            transition:0.2s;
        }
        .tab-btn.active{
            background:#ff88aa;
            color:#fff;
            border-color:#ff88aa;
        }
        .tab-btn:hover:not(.active){
            background:#ffe6ee;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom:50px;
        }
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            background: #fff;
            padding: 2px;
            background-image: linear-gradient(135deg,#ffd6e4,#ffe8ef,#ffd6e4);
            box-shadow: 0 4px 14px rgba(123, 65, 87, 0.08);
            cursor: pointer;
            min-height: 200px;
        }
        .gallery-item::before {
            content: "";
            display: block;
            background: #fff;
            border-radius: 14px;
            position: absolute;
            inset: 2px;
            z-index: 0;
        }
        .gallery-item > * {
            position: relative;
            z-index: 1;
        }
        .gallery-item img {
            width: calc(100% - 16px);
            height: 200px;
            object-fit: cover;
            border-radius:10px;
            margin: 8px;
            transition: transform 0.4s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.03);
        }
        .gallery-item .dec {
            position:absolute;
            font-size:20px;
            opacity:0.5;
            pointer-events:none;
            z-index:2;
            animation:decFloat 4s ease-in-out infinite alternate;
        }
        @keyframes decFloat {
            0%{transform:translateY(0px);}
            100%{transform:translateY(-3px);}
        }
        .dec-tl { top:6px; left:8px; }
        .dec-tr { top:6px; right:8px; }
        .dec-bl { bottom:6px; left:8px; }
        .dec-br { bottom:6px; right:8px; }
        .note-wall{
            margin:60px 0;
        }
        .block-title{
            text-align:center;
            font-size:24px;
            margin-bottom:32px;
            color:#7b4157;
        }
        .note-input-area{
            max-width:600px;
            margin:0 auto 30px;
            background:#fff;
            padding:20px;
            border-radius:14px;
            box-shadow:0 3px 12px rgba(123, 65, 87, 0.08);
        }
        #noteTextarea{
            width:100%;
            min-height:80px;
            padding:12px;
            border:1px solid #ffd6e4;
            border-radius:8px;
            resize:vertical;
            font-size:15px;
        }
        .note-mode-tip{
            margin-top:10px;
            font-size:12px;
            color:#c2889f;
            text-align:center;
        }
        .upload-section{
            max-width:600px;
            margin:0 auto 30px;
        }
        .upload-panel{
            background:#fff;
            border-radius:14px;
            box-shadow:0 3px 12px rgba(123,65,87,0.08);
            padding:14px 20px;
        }
        .upload-panel summary{
            cursor:pointer;
            font-size:16px;
            color:#7b4157;
            font-weight:bold;
        }
        .upload-body{
            margin-top:14px;
            display:flex;
            flex-direction:column;
            gap:14px;
        }
        .upload-row{
            display:flex;
            flex-direction:column;
            gap:8px;
        }
        .upload-row label{
            font-size:14px;
            color:#b0748c;
        }
        .upload-row button{
            align-self:flex-start;
            padding:8px 20px;
            background:#ff88aa;
            color:#fff;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:14px;
        }
        .upload-row button:disabled{
            opacity:0.5;
        }
        .album-pick{
            display:flex;
            align-items:center;
            flex-wrap:wrap;
            gap:8px;
        }
        .album-label{
            font-size:14px;
            color:#b0748c;
        }
        .upload-row button.album-chip{
            padding:5px 14px;
            border:2px solid #ffd6e4;
            background:#fff;
            color:#7b4157;
            cursor:pointer;
            font-size:13px;
            border-radius:999px;
            align-self:auto;
            transition:0.2s;
        }
        .upload-row button.album-chip.active{
            background:#ff88aa;
            color:#fff;
            border-color:#ff88aa;
        }
        .album-hint{
            font-size:12px;
            color:#c2889f;
        }
        .upload-manage{
            margin-top:4px;
            border-top:1px dashed #ffd6e4;
            padding-top:12px;
        }
        .manage-title{
            font-size:14px;
            color:#b0748c;
            margin-bottom:10px;
            cursor:pointer;
            user-select:none;
            transition:0.2s;
        }
        .manage-title:hover{
            color:#7b4157;
        }
        .mg-arrow{
            display:inline-block;
            font-size:10px;
            margin-right:5px;
            transition:transform 0.2s;
        }
        .upload-manage.collapsed .mg-arrow{
            transform:rotate(-90deg);
        }
        .upload-manage.collapsed #managePhotos,
        .upload-manage.collapsed #manageSongs{
            display:none;
        }
        .manage-grid{
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(84px, 1fr));
            gap:8px;
            margin-bottom:10px;
        }
        .manage-item{
            position:relative;
            border-radius:8px;
            overflow:hidden;
            background:#fff0f6;
        }
        .manage-item img{
            width:100%;
            height:64px;
            object-fit:cover;
            display:block;
        }
        .manage-del{
            position:absolute;
            top:3px;
            right:3px;
            width:20px;
            height:20px;
            border:none;
            border-radius:50%;
            background:rgba(255,255,255,0.92);
            color:#e0557f;
            cursor:pointer;
            font-size:12px;
            line-height:18px;
            padding:0;
        }
        .manage-del:disabled{
            opacity:0.4;
        }
        .manage-del-inline{
            position:static;
            flex:none;
        }
        .manage-list{
            display:flex;
            flex-direction:column;
            gap:6px;
        }
        .manage-song{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:8px;
            font-size:13px;
            color:#7b4157;
            padding:6px 10px;
            border-radius:8px;
            background:#fff0f6;
        }
        .ms-name{
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
        }
        .note-btn-row{
            margin-top:12px;
            text-align:right;
        }
        #addNoteBtn{
            padding:8px 22px;
            background:#ff88aa;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:15px;
        }
        #addNoteBtn:hover{
            background:#ff6b98;
        }
        .note-container{
            display:flex;
            flex-wrap:wrap;
            gap:18px;
            justify-content:center;
        }
        .month-group{
            width:100%;
            text-align:center;
        }
        .month-head{
            display:inline-flex;
            align-items:center;
            gap:7px;
            padding:6px 16px;
            background:rgba(255,255,255,0.8);
            border:1px solid #ffd6e4;
            border-radius:999px;
            color:#b0748c;
            font-size:14px;
            cursor:pointer;
            user-select:none;
            transition:0.2s;
        }
        .month-head:hover{
            background:#fff;
            color:#7b4157;
        }
        .month-arrow{
            display:inline-block;
            font-size:10px;
            transition:transform 0.2s;
        }
        .month-count{
            font-size:12px;
            color:#c2889f;
        }
        .month-group.collapsed .month-arrow{
            transform:rotate(-90deg);
        }
        .month-group.collapsed .month-cards{
            display:none;
        }
        .month-cards{
            display:flex;
            flex-wrap:wrap;
            gap:18px;
            justify-content:center;
            margin-top:14px;
        }
        .note{
            width:180px;
            padding:16px 14px;
            border-radius:6px;
            box-shadow:2px 3px 8px rgba(0,0,0,0.12);
            transform:rotate(var(--r));
            transition:transform 0.25s ease;
            cursor:default;
            position:relative;
            display:flex;
            flex-direction:column;
        }
        .note:hover{
            transform:rotate(0deg) scale(1.05);
            z-index:2;
        }
        .note-del{
            position:absolute;
            top:4px;
            right:6px;
            font-size:14px;
            cursor:pointer;
            opacity:0.4;
        }
        .note:hover .note-del{
            opacity:1;
        }
        .note-pinbtn{
            position:absolute;
            top:4px;
            right:26px;
            font-size:12px;
            cursor:pointer;
            opacity:0.35;
            transition:0.2s;
        }
        .note:hover .note-pinbtn{
            opacity:1;
        }
        .note-pinbtn.pinned{
            opacity:0.9;
        }
        .note-pin-badge{
            position:absolute;
            top:5px;
            left:8px;
            font-size:16px;
            z-index:3;
            filter:drop-shadow(0 1px 1px rgba(0,0,0,0.15));
        }
        .note.pinned .dec-tl{
            display:none;
        }
        .note.pinned{
            box-shadow:2px 3px 10px rgba(255,136,170,0.4);
        }
        .note-sign{
            position:absolute;
            bottom:8px;
            left:10px;
            opacity:0.9;
            filter:drop-shadow(0 1px 1px rgba(0,0,0,0.12));
        }
        .sign-pick{
            display:flex;
            align-items:center;
            flex-wrap:wrap;
            gap:8px;
            margin-top:10px;
        }
        .sign-label{
            font-size:14px;
            color:#b0748c;
        }
        .sign-chip{
            padding:5px 14px;
            border-radius:999px;
            border:2px solid #ffd6e4;
            background:#fff;
            color:#7b4157;
            cursor:pointer;
            font-size:13px;
            transition:0.2s;
        }
        .sign-chip.active{
            background:#ff88aa;
            color:#fff;
            border-color:#ff88aa;
        }
        .sign-hint{
            font-size:12px;
            color:#c2889f;
        }
        .note-1{background:#fff8bc; --r:-2deg;}
        .note-2{background:#ffddee; --r:2deg;}
        .note-3{background:#dcf6ff; --r:-1.5deg;}
        .note-4{background:#ffe9cc; --r:1.8deg;}
        .note-text{
            font-size:15px;
            line-height:1.6;
            flex:1;
        }
        .note-date{
            margin-top:8px;
            text-align:right;
            font-size:12px;
            color:#cba3b5;
            letter-spacing:0.5px;
        }
        .words {
            margin-top: 40px;
            padding: 24px;
            background: #fff;
            border-radius: 16px;
            line-height: 1.8;
            font-size: 17px;
        }
        footer {
            margin-top: 40px;
            text-align: center;
            color: #c2889f;
        }
        footer .beian{
            margin-top: 6px;
            font-size: 12px;
        }
        footer .beian a{
            color: #c2889f;
            text-decoration: none;
            opacity: .75;
        }
        footer .beian a:hover{
            opacity: 1;
        }

        /* =========底部导航【默认隐藏，向下滑动后从底部出现】========= */
        .page-section{
            display:none;
        }
        .page-section.active{
            display:block;
        }
        .dock-nav{
            position:fixed;
            left:50%;
            bottom:calc(14px + env(safe-area-inset-bottom));
            width:min(560px, calc(100% - 24px));
            display:flex;
            align-items:flex-end;
            justify-content:space-around;
            padding:10px 10px;
            background:rgba(255,255,255,0.9);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            border-radius:22px;
            box-shadow:0 8px 26px rgba(123,65,87,0.18);
            z-index:12;
            transform:translate(-50%, 110%);
            opacity:0;
            pointer-events:none;
            transition:transform 0.35s cubic-bezier(0.22,0.61,0.36,1), opacity 0.28s ease;
        }
        .dock-nav.show{
            transform:translate(-50%, 0);
            opacity:1;
            pointer-events:auto;
        }
        .nav-item{
            flex:1;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:4px;
            padding:2px 0;
            background:none;
            border:none;
            color:#b0748c;
            font-size:12px;
            cursor:pointer;
            -webkit-tap-highlight-color:transparent;
        }
        .nav-ico{
            width:34px;
            height:34px;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:50%;
            font-size:18px;
            line-height:1;
            transition:background 0.25s ease, transform 0.25s ease;
        }
        .nav-item.active{
            color:#ff4d7d;
            font-weight:bold;
        }
        .nav-item.active .nav-ico{
            background:#ffe0ea;
            transform:scale(1.05);
        }
        /* 中间的音乐按钮：圆形凸起 */
        .nav-music .nav-ico{
            width:46px;
            height:46px;
            margin-top:-16px;
            font-size:22px;
            color:#fff;
            background:linear-gradient(135deg,#ff9dbb,#ff5f8f);
            box-shadow:0 6px 16px rgba(255,95,143,0.35);
        }
        .nav-music.active .nav-ico{
            transform:scale(1.06);
        }

        /* =========音频面板【居中放大的悬浮窗：点底部导航"音乐"打开/关闭】========= */
        .audio-panel{
            position:fixed;
            left:50%;
            top:50%;
            right:auto;
            bottom:auto;
            transform:translate(-50%,-50%);
            width:min(460px, calc(100vw - 40px));
            background:#fff;
            padding:22px;
            border-radius:22px;
            box-shadow:0 12px 44px rgba(123,65,87,0.28);
            z-index:30;
            display:none;
            flex-direction:column;
            gap:16px;
            user-select:none;
            touch-action:none;
        }
        /* 打开状态：居中放大弹出 */
        .audio-panel.music-open{
            display:flex;
            animation:musicPop 0.28s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes musicPop{
            0%{opacity:0;transform:translate(-50%,-50%) scale(0.9);}
            100%{opacity:1;transform:translate(-50%,-50%) scale(1);}
        }
        /* 歌词条模式不做居中弹出动画 */
        .audio-panel.lyric-bar-mode.music-open{
            animation:none;
        }
        /* 放大后的按钮/滑块（仅在居中弹窗模式生效，歌词条模式保持原大小） */
        .audio-panel.music-open:not(.lyric-bar-mode) .audio-icon{
            width:48px;
            height:48px;
            font-size:19px;
        }
        .audio-panel.music-open:not(.lyric-bar-mode) .play-main{
            width:56px;
            height:56px;
            font-size:22px;
        }
        .audio-panel.music-open:not(.lyric-bar-mode) .volume-wrap input{
            width:min(220px, 60%);
        }
        /* 弹窗模式：限高可滚动，歌单展开时不超出屏幕 */
        .audio-panel.music-open:not(.lyric-bar-mode){
            max-height:calc(100vh - 48px);
            overflow-y:auto;
            touch-action:auto;
        }
        /* 弹窗模式：白底面板上的按钮配色（歌词条模式不受影响） */
        .audio-panel.music-open:not(.lyric-bar-mode) .btn-row .audio-icon:not(.play-main){
            background:#fff2f7;
            color:#9c6a7f;
            box-shadow:0 2px 6px rgba(255,150,180,0.18);
        }
        .audio-panel.music-open:not(.lyric-bar-mode) .btn-row .audio-icon:not(.play-main):hover{
            background:#ffe0ea;
            color:#e0447f;
        }
        .audio-panel.music-open:not(.lyric-bar-mode) #listBtn.active{
            background:#ffe0ea;
            color:#e0447f;
        }
        .audio-panel.music-open:not(.lyric-bar-mode) .play-main{
            background:#ff5f8f;
            box-shadow:0 6px 18px rgba(255,95,143,0.35);
        }
        .audio-panel.music-open:not(.lyric-bar-mode) .play-main:hover{
            background:#ff4780;
        }
        .audio-panel.music-open:not(.lyric-bar-mode) #lyricToggleBtn{
            background:#fff2f7;
            color:#9c6a7f;
        }

        /* ===== 弹窗模式顶部：歌曲封面 + 歌名 + 可拖动进度条 ===== */
        .np-block{
            display:flex;
            align-items:flex-start;
            gap:14px;
            position:relative;
        }
        .audio-panel.lyric-bar-mode .np-block{
            display:none;
        }
        .np-cover{
            width:96px;
            height:96px;
            flex:none;
            border-radius:14px;
            overflow:hidden;
            background:linear-gradient(135deg,#ffd3e2,#ff9dbb);
            box-shadow:0 6px 16px rgba(255,120,162,0.25);
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .np-cover img{
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
        }
        .np-info{
            flex:1;
            min-width:0;
            padding-top:2px;
            padding-right:26px;
        }
        .np-title{
            font-size:20px;
            font-weight:bold;
            color:#3c2430;
            line-height:1.25;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }
        .np-artist{
            font-size:13px;
            color:#a98494;
            margin-top:3px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }
        .np-range{
            -webkit-appearance:none;
            appearance:none;
            width:100%;
            height:18px;
            margin:10px 0 0;
            padding:0;
            background:transparent;
            cursor:pointer;
            display:block;
            touch-action:pan-x;
        }
        .np-range::-webkit-slider-runnable-track{
            height:4px;
            border-radius:999px;
            background:linear-gradient(90deg,#ff6f9f 0%,#ff6f9f var(--p,0%),#f4d8e2 var(--p,0%),#f4d8e2 100%);
        }
        .np-range::-webkit-slider-thumb{
            -webkit-appearance:none;
            width:14px;
            height:14px;
            margin-top:-5px;
            border-radius:50%;
            background:#ff6f9f;
            border:2px solid #fff;
            box-shadow:0 1px 4px rgba(255,95,143,0.45);
        }
        .np-range::-moz-range-track{
            height:4px;
            border-radius:999px;
            background:#f4d8e2;
        }
        .np-range::-moz-range-progress{
            height:4px;
            border-radius:999px;
            background:#ff6f9f;
        }
        .np-range::-moz-range-thumb{
            width:12px;
            height:12px;
            border-radius:50%;
            background:#ff6f9f;
            border:2px solid #fff;
        }
        .np-times{
            display:flex;
            justify-content:space-between;
            font-size:12px;
            color:#b8a0ac;
            margin-top:2px;
        }
        .np-close{
            position:absolute;
            top:-6px;
            right:-6px;
            width:28px;
            height:28px;
            border:none;
            border-radius:50%;
            background:#f6eef2;
            color:#9c8390;
            font-size:13px;
            line-height:1;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            transition:0.2s;
        }
        .np-close:hover{
            background:#ffe0ea;
            color:#e0447f;
        }

        /* ===== 弹窗模式：面板下方展开的歌单列表 ===== */
        .plist-section{
            display:none;
            border-top:1px solid #f3e2e9;
            padding-top:12px;
        }
        .plist-section.show{
            display:block;
        }
        .audio-panel.lyric-bar-mode .plist-section{
            display:none !important;
        }
        .plist-head{
            display:flex;
            align-items:center;
            justify-content:space-between;
            margin-bottom:8px;
        }
        .plist-head .pt{
            font-size:15px;
            font-weight:bold;
            color:#3c2430;
        }
        .plist-head .pc{
            font-size:12px;
            color:#b08c9b;
        }
        .plist-list{
            max-height:230px;
            overflow-y:auto;
            touch-action:pan-y;
            display:flex;
            flex-direction:column;
            gap:2px;
        }
        .pl-item2{
            display:flex;
            align-items:center;
            gap:10px;
            padding:8px;
            border-radius:10px;
            cursor:pointer;
            transition:background 0.18s;
        }
        .pl-item2:hover{
            background:#fff3f7;
        }
        .pl-item2.active{
            background:#ffeaf1;
        }
        .pl-num{
            width:18px;
            flex:none;
            text-align:center;
            font-size:13px;
            color:#bda7b2;
        }
        .pl-item2.active .pl-num{
            color:#ff5f8f;
            font-weight:bold;
        }
        .pl-thumb{
            width:42px;
            height:42px;
            flex:none;
            border-radius:9px;
            overflow:hidden;
            background:linear-gradient(135deg,#ffd3e2,#ff9dbb);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:15px;
            font-weight:bold;
            color:#fff;
        }
        .pl-thumb img{
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
        }
        .pl-meta{
            flex:1;
            min-width:0;
        }
        .pl-name{
            font-size:14px;
            color:#3c2430;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }
        .pl-item2.active .pl-name{
            color:#e0447f;
            font-weight:bold;
        }
        .pl-artist{
            font-size:12px;
            color:#b497a5;
            margin-top:2px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }
        .pl-lrc{
            flex:none;
            font-size:10px;
            color:#fff;
            background:#ffa8c2;
            border-radius:6px;
            padding:1px 5px;
        }
        /* 弹窗模式默认隐藏拖拽/缩放/重置；歌词条模式恢复缩放手柄与"恢复默认大小"按钮 */
        .audio-panel .resize-handle,
        .audio-panel .reset-icon,
        .audio-panel .adapt-icon{
            display:none !important;
        }
        .audio-panel.lyric-bar-mode .resize-handle,
        .audio-panel.lyric-bar-mode .adapt-icon{
            display:block !important;
        }
        /*右下角缩放手柄*/
        .resize-handle{
            position:absolute;
            width:16px;
            height:16px;
            right:0;
            bottom:0;
            border-radius:0 0 18px 0;
            cursor:se-resize;
            background:rgba(255,136,170,0.25);
        }
        /* 重置按钮（右上角） */
        .reset-icon{
            position:absolute;
            top:0;
            right:0;
            width:8px;
            height:8px;
            font-size:6px;
            border-radius:50%;
            opacity:0;
            background:#fff;
            transition: opacity 0.2s ease;
            z-index:9;
        }
        .audio-panel:hover .reset-icon{
            opacity:0.7;
        }
        .reset-icon:hover{
            opacity:1 !important;
            background:#ffd6e4;
        }
        /* 恢复默认适配按钮（右上角，重置大小/位置/行数，保留当前模式） */
        .adapt-icon{
            position:absolute;
            top:1px;
            right:18px;
            width:16px;
            height:16px;
            font-size:9px;
            border-radius:50%;
            opacity:0;
            pointer-events:none;
            background:#fff;
            transition: opacity 0.2s ease;
            z-index:8;
        }
        .adapt-icon:hover{
            opacity:1 !important;
            background:#ffd6e4;
        }
        /* 歌词条模式：恢复按钮默认隐藏，点击浮现控制行时一起出现 */
        .audio-panel.lyric-bar-mode .adapt-icon{
            opacity:0;
            pointer-events:none;
        }
        .audio-panel.lyric-bar-mode .bar-controls.show ~ .adapt-icon{
            opacity:0.7;
            pointer-events:auto;
        }

        /* ====== QQ音乐桌面歌词长条模式（PC+手机全部可用） ====== */
        .audio-panel.lyric-bar-mode{
            flex-direction:row;
            align-items:center;
            /* 歌词条：恢复自由悬浮，默认贴屏幕顶端居中，可拖动/缩放 */
            left:0;
            right:0;
            margin:0 auto;
            top:20px;
            bottom:auto;
            transform:none;
            cursor:move;
            width:min(480px, calc(100vw - 40px));
            height:84px;
            padding:0 14px;
            background:rgba(255,230,238,0.55);
            backdrop-filter: blur(8px);
            gap:0;
        }
        /* 歌词条模式默认隐藏全部按钮，只留歌词（点击浮现控制行） */
        .audio-panel.lyric-bar-mode .btn-row,
        .audio-panel.lyric-bar-mode .volume-wrap,
        .audio-panel.lyric-bar-mode .reset-icon{
            display:none;
        }
        /* 两行歌词显示区（默认隐藏，长条模式才显示） */
        .single-lyric-text{
            display:none;
        }
        .audio-panel.lyric-bar-mode .single-lyric-text{
            display:flex;
            flex:1;
            min-width:0;
            flex-direction:column;
            justify-content:center;
            gap:2px;
            overflow:hidden;
            text-align:center;
            cursor:pointer;
        }
        .lyric-line{
            font-size:15px;
            line-height:1.35;
            color:#a87389;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }
        /* 上排：正在播放的句子（高亮） */
        .lyric-line.lyric-prev{
            font-size:18px;
            color:#e0447f;
            font-weight:bold;
        }
        /* 三行模式：大字当前句居中，上排变回暗色的前一句 */
        .audio-panel.lyric-bar-mode.three-line .lyric-prev{
            font-size:15px;
            color:#a87389;
            font-weight:normal;
        }
        .audio-panel.lyric-bar-mode.three-line .lyric-cur{
            font-size:18px;
            color:#e0447f;
            font-weight:bold;
        }
        /* 悬浮窗高度不足时自动缩减为一行 */
        .audio-panel.lyric-bar-mode.one-line .lyric-prev{
            display:none;
        }
        /* 第三行歌词：默认隐藏，拖高到 110px 以上自动出现 */
        .lyric-next2{
            display:none;
        }
        .audio-panel.lyric-bar-mode.three-line .lyric-next2{
            display:block;
        }
        /* 歌词切换时的上滑滚动动画 */
        .audio-panel.lyric-bar-mode .single-lyric-text.slide .lyric-line{
            animation: lyricSlide .35s ease;
        }
        @keyframes lyricSlide{
            from{ transform:translateY(12px); opacity:.1; }
            to{ transform:translateY(0); opacity:1; }
        }
        /* 点击歌词条后浮现的控制行（3秒无操作自动隐藏） */
        .bar-controls{
            position:absolute;
            inset:0;
            display:none;
            align-items:center;
            justify-content:center;
            gap:16px;
            background:rgba(255,230,238,0.92);
            border-radius:inherit;
            z-index:6;
        }
        .bar-controls.show{
            display:flex;
        }
        .bar-controls .audio-icon{
            width:34px;
            height:34px;
            font-size:14px;
        }
        .bar-controls .play-main{
            width:40px;
            height:40px;
        }
        /* 播放列表弹层 */
        .playlist-pop{
            position:absolute;
            right:0;
            width:230px;
            max-height:300px;
            overflow-y:auto;
            background:#fff;
            border-radius:12px;
            box-shadow:0 6px 24px rgba(123,65,87,.28);
            padding:8px;
            display:none;
            z-index:60;
        }
        .playlist-pop.show{
            display:block;
        }
        .playlist-pop .pl-item{
            padding:9px 12px;
            border-radius:8px;
            font-size:14px;
            color:#7b4157;
            cursor:pointer;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:8px;
        }
        .playlist-pop .pl-item:hover{
            background:#ffe6ee;
        }
        .playlist-pop .pl-item.active{
            background:#ff88aa;
            color:#fff;
        }
        .playlist-pop .pl-tag{
            font-size:11px;
            opacity:.75;
            flex:none;
        }
        /* 手机端音频面板适配 */
        @media (max-width: 600px){
            .audio-panel.lyric-bar-mode{
                max-width: calc(100vw - 40px);
            }
            .lyric-line{
                font-size:14px;
            }
            .lyric-line.lyric-cur{
                font-size:16px;
            }
            .np-cover{
                width:78px;
                height:78px;
            }
            .np-title{
                font-size:17px;
            }
        }

        .btn-row{
            display:flex;
            gap:10px;
            align-items:center;
            justify-content:center;
        }
        .audio-icon{
            width:36px;
            height:36px;
            border:none;
            border-radius:50%;
            background:#ffffff;
            color:#7b4157;
            font-size:16px;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            box-shadow:0 2px 5px rgba(0,0,0,0.06);
        }
        .audio-icon:hover{
            background:#f8d2e0;
        }
        .play-main{
            width:42px;
            height:42px;
            background:#ff78a2;
            color:#fff;
        }
        .play-main:hover{
            background:#ff588c;
        }
        /*第二排：音量+词按钮，整行居中对齐，缩短音量滑块长度*/
        .volume-wrap{
            display:flex;
            align-items:center;
            gap:8px;
            justify-content:center;
        }
        .volume-wrap input{
            width:80px;
        }
        #lyricToggleBtn{
            width:28px;
            height:28px;
            font-size:13px;
        }

        .lightbox{
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.85);
            z-index:999;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        .lightbox.show{
            display:flex;
        }
        .lightbox img{
            max-width:90%;
            max-height:90vh;
            border-radius:12px;
            animation:fade 0.35s ease;
        }
        @keyframes fade{
            from{opacity:0;transform:scale(0.92)}
            to{opacity:1;transform:scale(1)}
        }
        .lightbox-close{
            position:absolute;
            top:24px;
            right:30px;
            color:white;
            font-size:36px;
            cursor:pointer;
        }

        /* ========== 双人档案卡 ========== */
        .couple-cards{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:14px;
            flex-wrap:wrap;
            margin-bottom:24px;
        }
        .person{
            position:relative;
            background:#fff;
            border-radius:50%;
            padding:6px;
            text-align:center;
            box-shadow:0 4px 16px rgba(123,65,87,0.08);
            transition:box-shadow 0.4s ease;
        }
        /* 爱心点亮时，头像投影加深 */
        .couple-cards.glow .person{
            box-shadow:0 6px 24px rgba(255,70,120,0.28);
        }
        .couple-cards.glow .person::after{
            content:"";
            position:absolute;
            inset:-9px;
            border-radius:50%;
            z-index:-2;
            box-shadow:0 0 26px rgba(255,80,130,0.55);
            animation:glowPulse 2.2s ease-in-out infinite;
        }
        /* 头像框：粉色流光缎带 + 星芒 + 彗星（仅爱心点亮后出现） */
        .af-svg{
            position:absolute;
            left:-7px;
            top:-7px;
            width:calc(100% + 14px);
            height:calc(100% + 14px);
            pointer-events:none;
            overflow:visible;
            opacity:0;
            transform:scale(0.9);
            transition:opacity 0.4s ease, transform 0.4s ease;
        }
        .couple-cards.glow .af-svg{
            opacity:1;
            transform:scale(1);
        }
        /* 完整光环：外圈厚光 + 白色内芯 + 绕环光点 */
        .af-halo{
            fill:none;
            stroke:#ff88aa;
            stroke-width:6;
            opacity:0.55;
            filter:blur(1.2px) drop-shadow(0 0 10px rgba(255,120,166,0.9));
        }
        .af-halo-core{
            fill:none;
            stroke:#fff4f8;
            stroke-width:1.6;
            opacity:0.95;
            filter:drop-shadow(0 0 7px rgba(255,158,193,0.95));
        }
        .af-dot{
            fill:#ffffff;
            filter:drop-shadow(0 0 8px rgba(255,45,85,0.95));
        }
        /* 逆向缓慢移动的淡光，制造"环在转动"的感觉 */
        .af-veil{
            fill:none;
            stroke:#ffb3cc;
            stroke-width:9;
            stroke-linecap:round;
            opacity:0.3;
            filter:blur(2.2px);
        }
        .af-veil-2{
            opacity:0.18;
            stroke-width:12;
        }
        .af-spin-rev{
            transform-box:view-box;
            transform-origin:60px 60px;
            animation:afSpin 11s linear infinite reverse;
        }
        /* 浮动光斑 */
        .af-orb{
            fill:#ffe6ee;
            opacity:0.5;
            filter:blur(1.2px) drop-shadow(0 0 6px rgba(255,170,205,0.85));
            animation:afOrb 4.2s ease-in-out infinite;
        }
        .af-orb.o2{animation-delay:0.9s;}
        .af-orb.o3{animation-delay:1.8s;}
        .af-orb.o4{animation-delay:2.6s;}
        .af-orb.o5{animation-delay:3.4s;}
        @keyframes afOrb{
            0%,100%{opacity:0.25;transform:translateY(0);}
            50%{opacity:0.75;transform:translateY(-3px);}
        }
        .af-star{
            fill:#ffffff;
            stroke:#ffc8d8;
            stroke-width:0.6;
            filter:drop-shadow(0 0 6px rgba(255,158,193,0.9));
            animation:starTwinkle 2.4s ease-in-out infinite;
        }
        .af-star:nth-of-type(2){animation-delay:0.6s;}
        .af-star:nth-of-type(3){animation-delay:1.2s;}
        .af-star:nth-of-type(4){animation-delay:1.8s;}
        .af-spin{
            transform-box:view-box;
            transform-origin:60px 60px;
            animation:afSpin 5s linear infinite;
        }
        @keyframes afSpin{
            to{transform:rotate(360deg);}
        }
        @keyframes starTwinkle{
            0%,100%{opacity:0.5;}
            50%{opacity:1;}
        }
        .couple-cards.glow .af-halo{
            stroke:#ff5f8f;
        }
        @keyframes glowPulse{
            0%,100%{opacity:0.35;}
            50%{opacity:0.85;}
        }
        /* 爱心点亮时，头像上下浮动（左右同频同相） */
        .couple-cards.glow .person{
            animation:floatBob 2.6s ease-in-out infinite;
        }
        @keyframes floatBob{
            0%,100%{transform:translateY(0);}
            50%{transform:translateY(-10px);}
        }
        /* 心跳曲线：点亮后一条心电波形穿过爱心，光点沿线循环流动 */
        .heart-link{
            overflow:visible;
        }
        .ekg-wave{
            position:absolute;
            left:50%;
            top:50%;
            width:64px;
            height:36px;
            transform:translate(-50%,-50%);
            opacity:0;
            pointer-events:none;
            transition:opacity 0.35s ease;
        }
        .heart-link.on .ekg-wave{
            opacity:1;
            animation:ekgIn 0.5s ease-out forwards;
        }
        .ekg-wave svg{
            width:100%;
            height:100%;
            overflow:visible;
        }
        .ekg-base{
            fill:none;
            stroke:rgba(255,109,152,0.55);
            stroke-width:2;
            stroke-linecap:round;
            stroke-linejoin:round;
            filter:drop-shadow(0 0 5px rgba(255,110,150,0.5));
        }
        .ekg-pulse{
            fill:none;
            stroke:#ff2d55;
            stroke-width:2.8;
            stroke-linecap:round;
            stroke-linejoin:round;
            stroke-dasharray:16 159;
            animation:ekgSweep 1.7s linear infinite;
            filter:drop-shadow(0 0 8px rgba(255,45,85,0.9));
        }
        @keyframes ekgSweep{
            from{stroke-dashoffset:16;}
            to{stroke-dashoffset:-159;}
        }
        @keyframes ekgIn{
            0%{opacity:0;transform:translate(-50%,-50%) scaleX(0.4);}
            100%{opacity:1;transform:translate(-50%,-50%) scaleX(1);}
        }
        .person .avatar{
            width:100px;
            height:100px;
            border-radius:50%;
            margin:0 auto;
            overflow:hidden;
            background:linear-gradient(135deg,#ffe3ec,#ffd0e0);
        }
        .person .avatar img{
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
        }
        .heart-link{
            position:relative;
            font-size:26px;
            line-height:1;
            padding:12px;
            color:#ff88aa;
            cursor:pointer;
            user-select:none;
            -webkit-tap-highlight-color:transparent;
            animation:beat 1.4s ease-in-out infinite;
            transition:color 0.25s ease, text-shadow 0.3s ease;
        }
        .heart-link.near{
            color:#ff6d98;
            text-shadow:0 0 14px rgba(255,120,160,0.65);
        }
        /* 爱心字形单独一层：便于放大而不与跳动动画冲突 */
        .heart-glyph{
            display:inline-block;
            transition:transform 0.42s cubic-bezier(0.34,1.56,0.64,1), color 0.35s ease;
        }
        .heart-link.on .heart-glyph{
            transform:scale(1.62);
            color:#ff2d55;
        }
        .heart-link.on{
            text-shadow:0 0 18px rgba(255,50,100,0.75);
        }
        .heart-link.burst{
            animation:heartPop 0.34s ease-out;
        }
        @keyframes heartPop{
            0%{transform:scale(1);}
            45%{transform:scale(1.36);}
            100%{transform:scale(1);}
        }
        /* 粒子层：溢出可见，不挡点击 */
        .heart-particles{
            position:absolute;
            inset:0;
            pointer-events:none;
            overflow:visible;
        }
        .heart-particle{
            position:absolute;
            left:50%;
            top:50%;
            line-height:1;
            will-change:transform,opacity;
            text-shadow:0 0 6px rgba(255,150,185,0.55);
        }
        @keyframes beat{
            0%,100%{transform:scale(1);}
            50%{transform:scale(1.16);}
        }
        .sub-count{
            font-size:14px;
            color:#b0748c;
            margin-top:10px;
            letter-spacing:2px;
            font-variant-numeric:tabular-nums;
        }

        /* ========== 进场页：虚化背景 + 居中头像与爱心 ========== */
        body.intro-on{
            overflow:hidden;
        }
        body.intro-on .container,
        body.intro-on footer{
            filter:blur(16px);
            opacity:0.45;
            pointer-events:none;
            user-select:none;
        }
        .container,
        footer{
            transition:filter 0.65s ease, opacity 0.65s ease;
        }
        .intro-screen{
            position:fixed;
            inset:0;
            z-index:120;
            display:flex;
            align-items:center;

        // 大图压缩：超过 900KB 的照片在前端压成 1920px 内的 JPEG（同时绕开上传与显示环节的 1MB 限制）
        function compressImage(file){
            if(file.size <= 900 * 1024){ return Promise.resolve(file); }
            return new Promise(function(resolve){
                const url = URL.createObjectURL(file);
                const im = new Image();
                im.onload = function(){
                    URL.revokeObjectURL(url);
                    try{
                        const maxSide = 1920;
                        const scale = Math.min(1, maxSide / Math.max(im.naturalWidth, im.naturalHeight));
                        const canvas = document.createElement("canvas");
                        canvas.width = Math.max(1, Math.round(im.naturalWidth * scale));
                        canvas.height = Math.max(1, Math.round(im.naturalHeight * scale));
                        canvas.getContext("2d").drawImage(im, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob(function(blob){
                            if(blob && blob.size < file.size){
                                resolve(new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }));
                            }else{
                                resolve(file);
                            }
                        }, "image/jpeg", 0.85);
                    }catch(e){ resolve(file); }
                };
                im.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
                im.src = url;
            });
        }

        // 留言所属月份（分组用）：优先显示日期字段 → 时间戳 → 兜底
        function noteYM(n){
            let d = null;
            if(n && n.date){
                const p = String(n.date).split("/");
                if(p.length === 3) d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
            }
            if(!d && n && n.ts) d = new Date(n.ts);
            if(!d && n && n.created_at) d = new Date(n.created_at);
            if(!d || isNaN(d.getTime())) d = new Date(2026, 9, 29);
            return d.getFullYear() + "年" + (d.getMonth() + 1) + "月";
        }
        // 按月份分组渲染留言：expand="first" 展开最前两组（服务器端新留言在前），"last" 展开最后两组（本地追加在尾部）
        function renderGroupedNotes(list, buildCard, container, expand){
            const groups = [];
            const pos = {};
            list.forEach((item, i)=>{
                const ym = noteYM(item);
                if(pos[ym] === undefined){ pos[ym] = groups.length; groups.push({ ym: ym, items: [] }); }
                groups[pos[ym]].items.push({ item: item, idx: i });
            });
            groups.forEach((g, gi)=>{
                const isOpen = false; // 默认全部折叠，点月份标题展开
                const groupDiv = document.createElement("div");
                groupDiv.className = "month-group" + (isOpen ? "" : " collapsed");
                const head = document.createElement("div");
                head.className = "month-head";
                head.innerHTML = '<span class="month-arrow">▼</span><span>' + escHtml(g.ym) + '</span><span class="month-count">' + g.items.length + '条</span>';
                const cards = document.createElement("div");
                cards.className = "month-cards";
                g.items.forEach(w=>{
                    cards.appendChild(buildCard(w.item, w.idx));
                });
                head.onclick = function(){ groupDiv.classList.toggle("collapsed"); };
                groupDiv.appendChild(head);
                groupDiv.appendChild(cards);
                container.appendChild(groupDiv);

        // ========== 相伴天数（精确到秒，每秒刷新）==========
        function calcDay() {
            const countEl = document.getElementById("count");
            const subEl = document.getElementById("countSub");
            if(!countEl) return;
            const start = new Date(startYear, startMonth - 1, startDay);
            const totalSec = Math.floor((new Date() - start) / 1000);
            if(totalSec < 0){
                countEl.innerText = "日期设置错误";
                if(subEl) subEl.innerText = "";
                return;

        // ========== 爱心粒子效果（鼠标靠近 + 点击）==========
        const HEART_CHARS = ["♥", "♥", "♥", "✦", "❣"];

        function spawnHeartParticle(layer, opt){
            if(!layer) return;
            const o = opt || {};
            const p = document.createElement("span");
            p.className = "heart-particle";
            p.textContent = o.char || HEART_CHARS[Math.floor(Math.random() * HEART_CHARS.length)];
            p.style.color = o.color || HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)];
            p.style.fontSize = (o.size || (8 + Math.random() * 9)) + "px";
            layer.appendChild(p);

            const angle = o.angle != null ? o.angle : Math.random() * Math.PI * 2;
            const dist = o.dist || (16 + Math.random() * 26);
            const dx = Math.cos(angle) * dist;
            const dy = Math.sin(angle) * dist - (o.rise || 0);
            // 爱心点亮（变大）时，粒子飘得更慢、停留更久
            const slow = layer.closest && layer.closest(".heart-link") && layer.closest(".heart-link").classList.contains("on");
            const dur = (o.dur || (700 + Math.random() * 500)) * (slow ? 2.6 : 1);
            const rot = (Math.random() * 2 - 1) * 45;

            const anim = p.animate([
                { transform: "translate(-50%,-50%) translate(0px, 0px) scale(0.3) rotate(0deg)", opacity: 0 },
                { transform: `translate(-50%,-50%) translate(${dx * 0.55}px, ${dy * 0.55}px) scale(1) rotate(${rot * 0.5}deg)`, opacity: 0.95, offset: 0.3 },
                { transform: `translate(-50%,-50%) translate(${dx}px, ${dy}px) scale(0.35) rotate(${rot}deg)`, opacity: 0 }
            ], { duration: dur, easing: "cubic-bezier(0.22,0.61,0.36,1)" });
            anim.onfinish = () => p.remove();
            anim.oncancel = () => p.remove();
        }

        // 全局只挂一次：鼠标靠近到 100px 内就持续冒小粒子
        function initHeartFx(){
            if(heartFxBound) return;
            heartFxBound = true;
            let lastEmit = 0;
            document.addEventListener("mousemove", function(e){
                const heart = document.querySelector(".heart-link");
                if(!heart) return;
                const r = heart.getBoundingClientRect();
                if(!r.width) return;
                const d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
                if(d < 100){
                    heart.classList.add("near");
                    const now = performance.now();
                    const big = heart.classList.contains("on");
                    const gap = (d < 48 ? 85 : 150) * (big ? 1.5 : 1);
                    if(now - lastEmit > gap){
                        lastEmit = now;
                        spawnHeartParticle(heart.querySelector(".heart-particles"), {
                            size: 7 + Math.random() * 7,
                            dist: 12 + Math.random() * 18,
                            rise: 10,
                            dur: 800 + Math.random() * 400
                        });
                    }
                } else {
                    heart.classList.remove("near");
                }
            }, { passive:true });
        }

        function bindHeartEffects(heart, layer){

                e.preventDefault();

                if(heart.parentNode) heart.parentNode.classList.toggle("glow", heart.classList.contains("on"));
                heart.classList.remove("burst");
                void heart.offsetWidth; // 重置动画
                heart.classList.add("burst");
                setTimeout(() => heart.classList.remove("burst"), 360);
                const total = 18;
                for(let i = 0; i < total; i++){
                    spawnHeartParticle(layer, {
                        size: 9 + Math.random() * 11,
                        dist: 34 + Math.random() * 46,
                        dur: 720 + Math.random() * 420,
                        angle: (Math.PI * 2 / total) * i + Math.random() * 0.3,

        function nextSolar(month, day){
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            let d = new Date(today.getFullYear(), month - 1, day);
            if(d < today) d = new Date(today.getFullYear() + 1, month - 1, day);
            return d;
        }
        function nthWeekdayOfMonth(year, month, weekday, nth){
            let d = new Date(year, month - 1, 1);
            let count = 0;
            while(d.getMonth() === month - 1){
                if(d.getDay() === weekday){
                    count++;
                    if(count === nth) return new Date(d);
                }
                d.setDate(d.getDate() + 1);
            }
            return new Date(year, month - 1, 1);
        }
        function nextNthWeekday(month, weekday, nth){
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            let d = nthWeekdayOfMonth(today.getFullYear(), month, weekday, nth);
            if(d < today) d = nthWeekdayOfMonth(today.getFullYear() + 1, month, weekday, nth);
            return d;
        }

            0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,

            0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,

            0x0d520
        ];
        function lunarLeapMonth(y){
            return LUNAR_INFO[y - 1900] & 0xf;
        }
        function lunarLeapDays(y){
            if(lunarLeapMonth(y)) return (LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29;
            return 0;
        }
        function lunarMonthDays(y, m){
            return (LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29;
        }
        function lunarYearDays(y){
            let sum = 348;
            for(let i = 0x8000; i > 0x8; i >>= 1) sum += (LUNAR_INFO[y - 1900] & i) ? 1 : 0;
            return sum + lunarLeapDays(y);
        }
        // 农历某年某月某日 -> 公历 Date
        function lunarToSolar(y, m, d){
            let offset = 0;
            for(let i = 1900; i < y; i++) offset += lunarYearDays(i);
            const leap = lunarLeapMonth(y);
            for(let i = 1; i < m; i++){
                offset += lunarMonthDays(y, i);
                if(leap && i === leap) offset += lunarLeapDays(y);
            }
            offset += d - 1;
            const date = new Date(1900, 0, 31);
            date.setDate(date.getDate() + offset);
            return date;
        }
        // 农历月日 -> 下一个公历日期（今天算作今天）
        function nextLunar(m, d){
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            let date = lunarToSolar(today.getFullYear(), m, d);
            date.setHours(0, 0, 0, 0);
            if(date < today){
                date = lunarToSolar(today.getFullYear() + 1, m, d);
                date.setHours(0, 0, 0, 0);
            }
            return date;
        }
        // 清明（第 5 个节气）的公历日期，用通用节气公式计算
        const SOLAR_TERM_INFO = [0,21208,42467,63836,85337,107014,128867,150921,173149,195551,218072,240693,263343,285989,308563,331033,353350,375494,397447,419210,440795,462224,483532,504758];
        function qingmingDay(y){
            const diff = 31556925974.7 * (y - 1900) + SOLAR_TERM_INFO[6] * 60000;
            return new Date(Date.UTC(1900, 0, 6, 2, 5) + diff).getUTCDate();
        }

            const today = new Date();

                }
                btn.disabled = false;
                return;
            }
            try{
                // 分块直传：函数读不回 >1MB 的对象，所以把 mp3 切成 768KB 小块逐块上传，播放时按需拼接
                const CHUNK = 786432;
                const initRes = await fetch("api/songs?mode=init", { method:"POST", headers:{ "content-type": "application/json" }, body: JSON.stringify({ name: f.name, size: f.size }) });
                const init = await initRes.json();
                if(!initRes.ok || !init.ok || !Array.isArray(init.urls)) throw new Error(init.error || initRes.status);
                for(let i = 0; i < init.urls.length; i++){
                    tip.textContent = "歌曲上传中 (" + (i + 1) + "/" + init.urls.length + ")…请稍等";
                    const blob = f.slice(i * CHUNK, Math.min(f.size, (i + 1) * CHUNK));
                    const putRes = await fetch(init.urls[i], { method: "PUT", headers: { "Content-Type": "application/octet-stream" }, body: blob });
                    if(!putRes.ok) throw new Error("分块直传失败" + putRes.status);
                }
                let lrcText = null;
                if(lf.files && lf.files.length > 0){ lrcText = await lf.files[0].text(); }
                const finRes = await fetch("api/songs?mode=finish", { method:"POST", headers:{ "content-type": "application/json" }, body: JSON.stringify({ id: init.id, name: f.name, size: f.size, chunks: init.urls.length, lrc: lrcText }) });
                const fin = await finRes.json();
                if(!finRes.ok || !fin.ok || !fin.song) throw new Error(fin.error || finRes.status);
                uploadedSongs.push({remote:true, id:fin.song.id, showName:fin.song.name, hasLrc:!!fin.song.hasLrc});
                renderManage();
                sf.value = "";
                lf.value = "";
                tip.textContent = "✅ 上传成功，点下一首即可播放新歌";
            }catch(e){
                tip.textContent = "上传失败：" + (e.message || "此入口仅在 EdgeOne 版可用");
            }
            btn.disabled = false;
        };

        //解析LRC（兼容常见变体：[mm:ss]、[m:ss]、[mm:ss.x]/[xx]/[xxx]、冒号分隔毫秒、一行多个时间标签）
        function parseLrc(text){
            const lines = text.split(/\r?\n/);
            const result = [];
            const timeReg = /\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
            for(let line of lines){
                timeReg.lastIndex = 0;
                const times = [];
                let m;
                while((m = timeReg.exec(line)) !== null){
                    const min = parseInt(m[1], 10);
                    const sec = parseInt(m[2], 10);
                    let ms = 0;
                    if(m[3]){ ms = parseInt(m[3], 10) * Math.pow(10, 3 - m[3].length); }
                    times.push(min * 60 + sec + ms / 1000);
                }
                if(times.length === 0) continue;
                timeReg.lastIndex = 0;
                const txt = line.replace(timeReg, "").trim();
                for(const t of times) result.push({ time: t, text: txt });
            }
            result.sort((a,b)=>a.time - b.time);
            return result;
        }
        function setBarMsg(msg){
            lastLyricIdx = -1;
            // 上排=正在播放的句子（高亮），下面依次是下一句、下下句（暗色）
            lyricPrevDom.textContent = msg;
            lyricCurDom.textContent = "";
            lyricNext2Dom.textContent = "";
        }
        function loadLyricText(lrcText){
            lyricLines = parseLrc(lrcText || "");
            if(lyricLines.length ===0){
                setBarMsg("暂无歌词");
            }else{
                setBarMsg(lyricLines[0].text || "等待播放");

        }
        async function loadLyric(lrcFileName){
            lyricLines = [];
            setBarMsg("加载歌词…");
            if(!lrcFileName || lrcFileName.trim()===""){
                setBarMsg("暂无歌词");
                return;
            }
            try{
                const resp = await fetch(lrcFileName.indexOf("api/") === 0 ? lrcFileName : ("music/" + lrcFileName));
                if(!resp.ok) throw new Error("not found");
                loadLyricText(await resp.text());
            }catch(err){
                setBarMsg("歌词加载失败");
            }
        }
        // 歌词校准：按歌曲独立生效（在 loadSong 中切换）
        let activeLrcOffset = 0.5;
        let activeLrcScale = 1;
        let activeLrcCalib = null;
        // 分段校准：按锚点 [播放器秒, 歌词时间轴秒] 分段线性插值
        function calibTime(t){
            const c = activeLrcCalib;
            if(!c || c.length < 2) return t;
            if(t <= c[0][0]) return c[0][1] + (t - c[0][0]);
            for(let i=1;i<c.length;i++){
                if(t <= c[i][0]){
                    const dt = c[i][0] - c[i-1][0];
                    if(dt <= 0) return c[i][1];
                    return c[i-1][1] + (t - c[i-1][0]) * (c[i][1] - c[i-1][1]) / dt;
                }
            }
            const n = c.length, dt = c[n-1][0] - c[n-2][0];
            if(dt <= 0) return c[n-1][1];
            return c[n-1][1] + (t - c[n-1][0]) * (c[n-1][1] - c[n-2][1]) / dt;
        }
        function updateSingleLyric(currentTime){
            if(lyricLines.length===0) return;
            const t = calibTime(currentTime * activeLrcScale + activeLrcOffset);
            let activeIndex = 0;
            for(let i=0;i<lyricLines.length;i++){
                if(t >= lyricLines[i].time){
                    activeIndex = i;
                }else break;
            }
            if(activeIndex === lastLyricIdx) return;
            lastLyricIdx = activeIndex;
            const nextText = i => (i < lyricLines.length ? (lyricLines[i].text || " ") : " ");
            if(barLineCount === 3){
                // 三行模式：大字当前句居中，上排=前一句，下排=下一句
                lyricPrevDom.textContent = nextText(activeIndex - 1);
                lyricCurDom.textContent = nextText(activeIndex);
                lyricNext2Dom.textContent = nextText(activeIndex + 1);
            }else{
                // 一/两行模式：大字当前句在最上排，下面依次往后排
                lyricPrevDom.textContent = nextText(activeIndex);
                lyricCurDom.textContent = nextText(activeIndex + 1);
                lyricNext2Dom.textContent = nextText(activeIndex + 2);
            }
            singleLyricDom.classList.remove("slide");
            void singleLyricDom.offsetWidth;
            singleLyricDom.classList.add("slide");
        }
        // 歌词行数随悬浮窗高度自适应：<78px 一行，>=110px 三行，其余两行
        let barLineCount = 2;
        function syncBarLines(){
            if(!isLyricBarMode) return;
            const h = audioPanel.offsetHeight;
            const count = h < 78 ? 1 : (h >= 110 ? 3 : 2);
            if(count !== barLineCount){ lastLyricIdx = -1; } // 行数变化时强制刷新歌词排版
            barLineCount = count;
            audioPanel.classList.toggle("one-line", count === 1);
            audioPanel.classList.toggle("three-line", count === 3);
        }
        // ⛶ 恢复按钮：仅当面板有自定义大小/位置时显示（默认大小无需恢复）
        function syncAdaptBtn(){
            const saved = localStorage.getItem("audioPanelPosSize");
            const custom = !!saved || audioPanel.style.width || audioPanel.style.height || audioPanel.style.left || audioPanel.style.top;
            audioPanel.classList.toggle("adapt-visible", !!custom && !isLyricBarMode);
        }

        // 尺寸变化后把面板钳回屏幕可视范围（防止切换歌词条后右侧/底部超出屏幕）
        function clampPanelIntoView(){
            const rect = audioPanel.getBoundingClientRect();
            const maxLeft = Math.max(0, window.innerWidth - rect.width);
            const maxTop = Math.max(0, window.innerHeight - rect.height);
            if(rect.left > maxLeft || rect.top > maxTop || rect.left < 0 || rect.top < 0){
                audioPanel.style.left = Math.min(Math.max(rect.left, 0), maxLeft) + "px";
                audioPanel.style.top = Math.min(Math.max(rect.top, 0), maxTop) + "px";
                audioPanel.style.right = "auto";
            }
        }

        function restorePanelPos(){
            const saved = JSON.parse(localStorage.getItem("audioPanelPosSize")||'{}');
            // 底部悬浮窗模式下不再恢复旧的位置/尺寸，只保留歌词条模式
            if(saved.lyricBarMode){
                isLyricBarMode = true;
                audioPanel.classList.add("lyric-bar-mode");
            }
            syncBarLines();
            syncAdaptBtn();
        }
        restorePanelPos();

        // 重置面板到初始状态
        function resetPanel(){
            localStorage.removeItem("audioPanelPosSize");
            audioPanel.style.left = "";

        document.getElementById("adaptBtn").onclick = function(e){

        function savePanelPosSize(){
            localStorage.setItem("audioPanelPosSize",JSON.stringify({
                left:parseInt(audioPanel.style.left||0),
                top:parseInt(audioPanel.style.top||0),
                w:parseInt(audioPanel.style.width||0),

        // 歌词条模式：支持拖动（居中弹窗模式固定居中，不可拖）
        audioPanel.addEventListener("pointerdown",(e)=>{
            if(!isLyricBarMode) return;
            if(e.target.closest(".audio-icon") || e.target===resizeHandle) return;
            isDragMove = true;
            dragMoved = false;
            dragDownX = e.clientX;
            dragDownY = e.clientY;
            const rect = audioPanel.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;
            audioPanel.style.left = rect.left + "px";
            audioPanel.style.top = rect.top + "px";
            audioPanel.style.right = "auto";
        })

        resizeHandle.addEventListener("pointerdown",(e)=>{
            e.stopPropagation();
            isResize = true;
            resizeStartX = e.clientX;
            resizeStartY = e.clientY;
            resizeStartW = audioPanel.offsetWidth;
            resizeStartH = audioPanel.offsetHeight;
        })

        document.addEventListener("pointermove",(e)=>{
            if(isDragMove){
                if(Math.abs(e.clientX - dragDownX) > 6 || Math.abs(e.clientY - dragDownY) > 6) dragMoved = true;
                let x = e.clientX - dragOffsetX;
                let y = e.clientY - dragOffsetY;
                const w = audioPanel.offsetWidth;
                const h = audioPanel.offsetHeight;
                x = Math.max(0, Math.min(window.innerWidth - w, x));
                y = Math.max(0, Math.min(window.innerHeight - h, y));
                audioPanel.style.left = x + "px";
                audioPanel.style.top = y + "px";
            }
            if(isResize){
                let dw = e.clientX - resizeStartX;
                let dh = e.clientY - resizeStartY;
                let newW = Math.max(MIN_W, resizeStartW + dw);
                // 歌词条模式允许拖得更矮（矮于78px自动缩成一行歌词）
                let newH = Math.max(isLyricBarMode ? 48 : MIN_H, resizeStartH + dh);
                newW = Math.min(newW, window.innerWidth-20);
                newH = Math.min(newH, window.innerHeight-20);
                audioPanel.style.width = newW + "px";
                audioPanel.style.height = newH + "px";
            }
        })

        document.addEventListener("pointerup",()=>{
            if(isDragMove||isResize){
                isDragMove = false;
                isResize = false;
                syncBarLines();
                savePanelPosSize();
                syncAdaptBtn();
            }
        })

        const npCover = document.getElementById("npCover");

        function fmtTime(sec){
            if(!isFinite(sec) || sec < 0) sec = 0;
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return m + ":" + (s < 10 ? "0" : "") + s;
        }
        // 歌手：歌曲配置里写 artist:"xxx" 才显示，没有就不显示这一行
        function songArtist(song){
            return (song && song.artist) ? song.artist : "";
        }
        // 封面：歌曲配置里写 cover:"xxx" 用专属封面；没有则统一用默认爱心音符图
        const DEFAULT_COVER = "img/cover-default.png";
        function fillCover(box, song){
            box.innerHTML = "";
            const img = document.createElement("img");
            img.src = (song && song.cover) ? song.cover : DEFAULT_COVER;
            img.alt = (song && song.showName) || "";
            box.appendChild(img);
        }
        function tintProgress(){
            const max = parseFloat(progressBar.max) || 0;
            const val = parseFloat(progressBar.value) || 0;
            const p = max > 0 ? Math.min(100, Math.max(0, val / max * 100)) : 0;
            progressBar.style.setProperty("--p", p.toFixed(2) + "%");
        }
        function syncProgress(){
            const d = music.duration;
            if(!isFinite(d) || d <= 0) return;
            if(Math.abs((parseFloat(progressBar.max) || 0) - d) > 0.5) progressBar.max = d;
            totalTimeEl.textContent = fmtTime(d);
            if(seeking) return;
            progressBar.value = music.currentTime;
            curTimeEl.textContent = fmtTime(music.currentTime);
            tintProgress();
        }
        function applySeek(t){
            const d = music.duration;
            if(isFinite(d) && d > 0) music.currentTime = Math.max(0, Math.min(t, d - 0.05));
            seeking = false;
            updateSingleLyric(music.currentTime);
            syncProgress();
        }
        function refreshNowPlaying(){

            const nm = (song && song.showName) || "歌曲";
            const artist = songArtist(song);

            npArtist.style.display = artist ? "" : "none";
            fillCover(npCover, song || { showName: nm });
            progressBar.max = 0;
            progressBar.value = 0;
            curTimeEl.textContent = "0:00";
            totalTimeEl.textContent = "0:00";
            tintProgress();

                    tag.textContent = "词";

        });
        // 松手时立即定位（change 事件在部分浏览器里时机不稳定，pointerup 兜底）
        progressBar.addEventListener("pointerup", function(){
            applySeek(parseFloat(this.value) || 0);
        });
        progressBar.addEventListener("change", function(){
            applySeek(parseFloat(this.value) || 0);

        function loadSong(index){
            const song = getSongs()[index];
            activeLrcOffset = (typeof song.lrcOffset === "number") ? song.lrcOffset : 0.5;
            activeLrcScale = (typeof song.lrcScale === "number") ? song.lrcScale : 1;
            activeLrcCalib = Array.isArray(song.lrcCalib) ? song.lrcCalib : null;
            if(song.remote){
                currentMusicSrc = song.src || ("api/songs?file=" + song.id);
                music.src = currentMusicSrc;
                if(song.lrcText){ loadLyricText(song.lrcText); }
                else{ loadLyric(song.hasLrc ? ("api/songs?lrc=" + song.id) : ""); }
                refreshNowPlaying();
                return;
            }
            currentMusicSrc = MUSIC_CDN_BASE ? (MUSIC_CDN_BASE + "/" + song.filePath) : ("music/" + song.filePath);
            music.src = currentMusicSrc;
            loadLyric(song.lrcPath);
            refreshNowPlaying();
        }

        music.addEventListener("error", function(){
            const song = getSongs()[currentSongIndex];
            if(!song || song.remote) return;
            const localSrc = "music/" + song.filePath;
            if(currentMusicSrc !== localSrc){
                currentMusicSrc = localSrc;

            }
        });

                    setPlayIcon("▶");

            loadSong(currentSongIndex);
