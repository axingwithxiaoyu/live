<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的小世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            color: #7b4157;
            padding: 30px 15px;
            position: relative;
            min-height: 100vh;
        }
        /* 手机端预留顶部空间给音频面板 */
        @media (max-width: 600px){
            body{
                padding-top: 80px;
            }
            /* 放大缩放手柄，方便手指点按 */
            .resize-handle{
                width: 26px;
                height: 26px;
            }
        }
        /* ========== 淡粉梦幻星空渐变背景 ========== */
        .starry-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(140deg, #ffe8f0 0%, #ffd8e8 30%, #fce4f2 60%, #fff0f6 100%);
        }
        .star-dot {
            position: absolute;
            border-radius: 50%;
            background-color: #ffffff;
            opacity: 0.6;
            animation: twinkle 3s ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 0.9; transform: scale(1.1); }
        }
        .meteor-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .meteor {
            position: absolute;
            top: -10%;
            width: 2px;
            height: 80px;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, #fff 50%, rgba(255,255,255,0) 100%);
            filter: drop-shadow(0 0 8px #ffcce0);
            animation: meteor linear infinite;
            opacity: 0;
        }
        @keyframes meteor {
            0% {
                transform: translateY(-100px) translateX(0) rotate(210deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) translateX(-220px) rotate(210deg);
                opacity: 0;
            }
        }
        .petal-wrap{
            position: fixed;
            inset:0;
            z-index:-1;
            pointer-events:none;
            overflow:hidden;
        }
        .petal{
            position:absolute;
            top:-10%;
            width:14px;
            height:14px;
            background:#ffc8d8;
            border-radius: 0 50% 50% 50%;
            opacity:0.75;
            animation:petalFall linear infinite, petalRotate ease-in-out infinite;
        }
        @keyframes petalFall{
            0%{transform:translateX(0) translateY(-50px);opacity:0;}
            10%{opacity:0.8;}
            100%{transform:translateX(80px) translateY(110vh);opacity:0;}
        }
        @keyframes petalRotate{
            0%{transform:rotate(0deg);}
            100%{transform:rotate(360deg);}
        }
        .heart-follow{
            position:fixed;
            pointer-events:none;
            z-index:99;
            font-size:18px;
            color:#ff88aa;
            opacity:0;
            animation:heartFloat 1.2s ease-out forwards;
        }
        @keyframes heartFloat{
            0%{opacity:0.8; transform:translateY(0) scale(1);}
            100%{opacity:0; transform:translateY(-60px) scale(0.4);}
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 12px;
        }
        .tip {
            font-size: 16px;
            color: #b0748c;
            margin-bottom: 20px;
        }
        .count-box {
            display: inline-block;
            background: #ffe6ee;
            padding: 16px 28px;
            border-radius: 999px;
            font-size: 20px;
        }
        .tab-wrap{
            display:flex;
            gap:12px;
            flex-wrap:wrap;
            justify-content:center;
            margin-bottom:30px;
        }
        .tab-btn{
            padding:8px 20px;
            border-radius:30px;
            border:2px solid #ffc8d8;
            background:#fff;
            color:#7b4157;
            cursor:pointer;
            font-size:16px;
            transition:0.2s;
        }
        .tab-btn.active{
            background:#ff88aa;
            color:#fff;
            border-color:#ff88aa;
        }
        .tab-btn:hover:not(.active){
            background:#ffe6ee;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom:50px;
        }
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            background: #fff;
            padding: 2px;
            background-image: linear-gradient(135deg,#ffd6e4,#ffe8ef,#ffd6e4);
            box-shadow: 0 4px 14px rgba(123, 65, 87, 0.08);
            cursor: pointer;
            min-height: 200px;
        }
        .gallery-item::before {
            content: "";
            display: block;
            background: #fff;
            border-radius: 14px;
            position: absolute;
            inset: 2px;
            z-index: 0;
        }
        .gallery-item > * {
            position: relative;
            z-index: 1;
        }
        .gallery-item img {
            width: calc(100% - 16px);
            height: 200px;
            object-fit: cover;
            border-radius:10px;
            margin: 8px;
            transition: transform 0.4s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.03);
        }
        .gallery-item .dec {
            position:absolute;
            font-size:20px;
            opacity:0.5;
            pointer-events:none;
            z-index:2;
            animation:decFloat 4s ease-in-out infinite alternate;
        }
        @keyframes decFloat {
            0%{transform:translateY(0px);}
            100%{transform:translateY(-3px);}
        }
        .dec-tl { top:6px; left:8px; }
        .dec-tr { top:6px; right:8px; }
        .dec-bl { bottom:6px; left:8px; }
        .dec-br { bottom:6px; right:8px; }
        .note-wall{
            margin:60px 0;
        }
        .block-title{
            text-align:center;
            font-size:24px;
            margin-bottom:32px;
            color:#7b4157;
        }
        .note-input-area{
            max-width:600px;
            margin:0 auto 30px;
            background:#fff;
            padding:20px;
            border-radius:14px;
            box-shadow:0 3px 12px rgba(123, 65, 87, 0.08);
        }
        #noteTextarea{
            width:100%;
            min-height:80px;
            padding:12px;
            border:1px solid #ffd6e4;
            border-radius:8px;
            resize:vertical;
            font-size:15px;
        }
        .note-btn-row{
            margin-top:12px;
            text-align:right;
        }
        #addNoteBtn{
            padding:8px 22px;
            background:#ff88aa;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:15px;
        }
        #addNoteBtn:hover{
            background:#ff6b98;
        }
        .note-container{
            display:flex;
            flex-wrap:wrap;
            gap:18px;
            justify-content:center;
        }
        .note{
            width:180px;
            padding:16px 14px;
            border-radius:6px;
            box-shadow:2px 3px 8px rgba(0,0,0,0.12);
            transform:rotate(var(--r));
            transition:transform 0.25s ease;
            cursor:default;
            position:relative;
        }
        .note:hover{
            transform:rotate(0deg) scale(1.05);
            z-index:2;
        }
        .note-del{
            position:absolute;
            top:4px;
            right:6px;
            font-size:14px;
            cursor:pointer;
            opacity:0.4;
        }
        .note:hover .note-del{
            opacity:1;
        }
        .note-1{background:#fff8bc; --r:-2deg;}
        .note-2{background:#ffddee; --r:2deg;}
        .note-3{background:#dcf6ff; --r:-1.5deg;}
        .note-4{background:#ffe9cc; --r:1.8deg;}
        .note-text{
            font-size:15px;
            line-height:1.6;
        }
        .words {
            margin-top: 40px;
            padding: 24px;
            background: #fff;
            border-radius: 16px;
            line-height: 1.8;
            font-size: 17px;
        }
        footer {
            margin-top: 40px;
            text-align: center;
            color: #c2889f;
        }

        /* =========音频面板【支持两种模式切换 + 缩放手柄】========= */
        .audio-panel{
            position: fixed;
            top:20px;
            right:20px;
            background:#ffe6ee;
            padding:14px 16px;
            border-radius:18px;
            box-shadow:0 3px 8px rgba(0,0,0,0.1);
            z-index:10;
            display:flex;
            flex-direction:column;
            gap:12px;
            transition: all 0.4s ease;
            cursor:move;
            user-select:none;
            touch-action:none;
        }
        /*右下角缩放手柄*/
        .resize-handle{
            position:absolute;
            width:16px;
            height:16px;
            right:0;
            bottom:0;
            border-radius:0 0 18px 0;
            cursor:se-resize;
            background:rgba(255,136,170,0.25);
        }
        /* 重置按钮（右上角） */
        .reset-icon{
            position:absolute;
            top:1px;
            right:1px;
            width:16px;
            height:16px;
            font-size:9px;
            border-radius:50%;
            opacity:0;
            background:#fff;
            transition: opacity 0.2s ease;
        }
        .audio-panel:hover .reset-icon{
            opacity:0.7;
        }
        .reset-icon:hover{
            opacity:1 !important;
            background:#ffd6e4;
        }

        /* ====== QQ音乐桌面歌词长条模式（PC+手机全部可用） ====== */
        .audio-panel.lyric-bar-mode{
            flex-direction:row;
            align-items:center;
            width:480px;
            height:56px;
            padding:0 14px;
            background:rgba(255,230,238,0.55);
            backdrop-filter: blur(8px);
            gap:12px;
        }
        /*长条模式隐藏音量整行*/
        .audio-panel.lyric-bar-mode .volume-wrap{
            display:none;
        }
        .audio-panel.lyric-bar-mode .btn-row{
            gap:4px;
        }
        .audio-panel.lyric-bar-mode .audio-icon{
            width:28px;
            height:28px;
            font-size:13px;
        }
        .audio-panel.lyric-bar-mode .play-main{
            width:32px;
            height:32px;
        }
        /* 手机端音频面板适配 */
        @media (max-width: 600px){
            .audio-panel.lyric-bar-mode{
                max-width: calc(100vw - 40px);
            }
            .audio-panel.lyric-bar-mode .single-lyric-text{
                font-size: 16px;
            }
        }
        /* 平板端适配：歌词条自动占屏幕约70%宽 */
        @media (min-width: 601px) and (max-width: 1366px) and (pointer: coarse){
            .audio-panel.lyric-bar-mode{
                width: 70vw;
                max-width: 900px;
            }
            .audio-panel.lyric-bar-mode .single-lyric-text{
                font-size: 22px;
            }
        }
        /* 单句歌词显示区域（默认隐藏，长条模式才显示） */
        .single-lyric-text{
            display:none;
        }
        .audio-panel.lyric-bar-mode .single-lyric-text{
            display:block;
            flex:1;
            text-align:center;
            font-size:20px;
            color:#7b4157;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .btn-row{
            display:flex;
            gap:10px;
            align-items:center;
            justify-content:center;
        }
        .audio-icon{
            width:36px;
            height:36px;
            border:none;
            border-radius:50%;
            background:#ffffff;
            color:#7b4157;
            font-size:16px;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            box-shadow:0 2px 5px rgba(0,0,0,0.06);
        }
        .audio-icon:hover{
            background:#f8d2e0;
        }
        .play-main{
            width:42px;
            height:42px;
            background:#ff78a2;
            color:#fff;
        }
        .play-main:hover{
            background:#ff588c;
        }
        /*第二排：音量+词按钮，整行居中对齐，缩短音量滑块长度*/
        .volume-wrap{
            display:flex;
            align-items:center;
            gap:8px;
            justify-content:center;
        }
        .volume-wrap input{
            width:80px;
        }
        #lyricToggleBtn{
            width:28px;
            height:28px;
            font-size:13px;
        }

        .lightbox{
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.85);
            z-index:999;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        .lightbox.show{
            display:flex;
        }
        .lightbox img{
            max-width:90%;
            max-height:90vh;
            border-radius:12px;
            animation:fade 0.35s ease;
        }
        @keyframes fade{
            from{opacity:0;transform:scale(0.92)}
            to{opacity:1;transform:scale(1)}
        }
        .lightbox-close{
            position:absolute;
            top:24px;
            right:30px;
            color:white;
            font-size:36px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="starry-bg" id="starryBg"></div>
    <div class="meteor-bg" id="meteorBg"></div>
    <div class="petal-wrap" id="petalWrap"></div>
    <div class="container">
        <div class="header">
            <h1>💌 我们的回忆相册</h1>
            <div class="tip">从相爱那天起，已经一起走过</div>
            <div class="count-box" id="count">计算中...</div>
        </div>
        <div class="tab-wrap" id="tabWrap">
            <button class="tab-btn active" data-filter="all">全部</button>
            <button class="tab-btn" data-filter="我的世界">我的世界</button>
            <button class="tab-btn" data-filter="第五人格">第五人格</button>
            <button class="tab-btn" data-filter="其他">其他</button>
        </div>
        <div class="gallery" id="galleryBox"></div>
        <section class="note-wall">
            <h2 class="block-title">💛 留言墙</h2>
            <div class="note-input-area">
                <textarea id="noteTextarea" placeholder="在这里写下你的悄悄话，提交生成便签（仅保存在本机浏览器）"></textarea>
                <div class="note-btn-row">
                    <button id="addNoteBtn">添加便签</button>
                </div>
            </div>
            <div class="note-container" id="noteBox"></div>
        </section>
        <div class="words">
            ✨ 写给我们：<br>
            很高兴和你相遇，
            所有细碎、温柔的瞬间，
            都值得好好收藏。
            往后日子，慢慢一起走。
        </div>
        <footer>
            Axing with Xiaoyu
        </footer>
    </div>
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close">&times;</span>
        <img id="lightImg" src="" alt="大图">
    </div>

    <!-- 音频面板：第一行播放按键，第二行音量+词按钮 -->
    <div class="audio-panel" id="audioPanel">
        <button class="audio-icon reset-icon" id="resetPanelBtn" title="恢复初始悬浮窗">⟲</button>
        <div class="btn-row">
            <button class="audio-icon" id="prevBtn" title="上一首">⏮</button>
            <button class="audio-icon play-main" id="musicBtn" title="播放/暂停">▶</button>
            <button class="audio-icon" id="nextBtn" title="下一首">⏭</button>
        </div>
        <!--第二排独立一行：音量滑块 + 词按钮-->
        <div class="volume-wrap">
            <span>🔊</span>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.7">
            <button class="audio-icon" id="lyricToggleBtn" title="切换桌面歌词模式">词</button>
        </div>
        <!-- 长条模式才会显示的单句歌词 -->
        <div class="single-lyric-text" id="singleLyric">等待播放音乐</div>
        <!--缩放手柄 右下角-->
        <div class="resize-handle" id="resizeHandle"></div>
    </div>

    <audio id="bgMusic" preload="auto"></audio>
    <script>
        const startYear = 2026;
        const startMonth = 8;
        const startDay = 28;
        const sweetEmojis = ["🍰","🍦","🍬","🍩","🧁","🍭"];

        const photoData = [
            {src:"img/1.jpg", tags:["我的世界"]},
            {src:"img/2.jpg", tags:["我的世界"]},
            {src:"img/3.jpg", tags:["我的世界"]},
            {src:"img/4.jpg", tags:["我的世界"]},
            {src:"img/5.jpg", tags:["我的世界"]},
            {src:"img/6.jpg", tags:["我的世界"]},
            {src:"img/7.jpg", tags:["我的世界"]},
            {src:"img/8.jpg", tags:["我的世界"]},
            {src:"img/9.jpg", tags:["我的世界"]},
            {src:"img/10.jpg", tags:["我的世界"]},
            {src:"img/11.jpg", tags:["我的世界"]},
            {src:"img/12.jpg", tags:["第五人格"]},
            {src:"img/13.jpg", tags:["第五人格"]},
            {src:"img/14.jpg", tags:["第五人格"]},
            {src:"img/15.jpg", tags:["第五人格"]},
            {src:"img/16.jpg", tags:["第五人格"]},
            {src:"img/17.jpg", tags:["第五人格"]}
        ];

        const staticNoteData = [
            { cls:"note-1", content:"和你在一起的每一天都很珍贵。" },
            { cls:"note-2", content:"希望岁岁年年，身边一直是你。" },
            { cls:"note-3", content:"难过的时候，有你就很安心。" },
            { cls:"note-4", content:"期待我们更多的未来故事✨" }
        ];

        const songList = [
            // lrcOffset: 歌词偏移秒数（正数=提前，负数=延后）
            // lrcScale: 歌词时间轴缩放（校准前半段/后半段快慢漂移）
            {filePath:"bg1.mp3", showName:"歌曲1", lrcPath:"bg1.lrc", lrcOffset:0.5, lrcScale:1},
            {filePath:"bg2.mp3", showName:"歌曲2", lrcPath:"bg2.lrc", lrcOffset:-1.3, lrcScale:1.02},
            {filePath:"bg3.mp3", showName:"歌曲3", lrcPath:"bg3.lrc", lrcOffset:0.5, lrcScale:1}
        ];

        let currentSongIndex = 0;
        let currentFilter = "all";
        let userNotes = JSON.parse(localStorage.getItem("loveNotes")) || [];

        //歌词全局
        let lyricLines = [];
        const audioPanel = document.getElementById("audioPanel");
        const lyricToggleBtn = document.getElementById("lyricToggleBtn");
        const singleLyricDom = document.getElementById("singleLyric");
        const resizeHandle = document.getElementById("resizeHandle");
        let isLyricBarMode = false;

        //拖拽移动变量
        let isDragMove = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        //缩放变量
        let isResize = false;
        let resizeStartX = 0;
        let resizeStartY = 0;
        let resizeStartW = 0;
        let resizeStartH = 0;
        const MIN_W = 160;
        const MIN_H = 80;

        function saveUserNotes(){
            localStorage.setItem("loveNotes", JSON.stringify(userNotes));
        }
        function renderAllNotes(){
            const noteBox = document.getElementById("noteBox");
            noteBox.innerHTML = "";
            staticNoteData.forEach(n=>{
                const div = document.createElement("div");
                div.className = "note " + n.cls;
                div.innerHTML = `<div class="note-text">${n.content}</div>`;
                noteBox.appendChild(div);
            });
            userNotes.forEach((item,idx)=>{
                const div = document.createElement("div");
                div.className = "note " + item.cls;
                div.innerHTML = `
                    <span class="note-del" data-idx="${idx}">✕</span>
                    <div class="note-text">${item.content}</div>
                `;
                noteBox.appendChild(div);
            })
            document.querySelectorAll(".note-del").forEach(el=>{
                el.onclick = function(e){
                    e.stopPropagation();
                    const i = Number(this.dataset.idx);
                    userNotes.splice(i,1);
                    saveUserNotes();
                    renderAllNotes();
                }
            })
        }
        document.getElementById("addNoteBtn").onclick = function(){
            const textarea = document.getElementById("noteTextarea");
            const txt = textarea.value.trim();
            if(!txt) return;
            const clsList = ["note-1","note-2","note-3","note-4"];
            const randomCls = clsList[Math.floor(Math.random()*clsList.length)];
            userNotes.push({cls:randomCls, content:txt});
            saveUserNotes();
            renderAllNotes();
            textarea.value = "";
        }
        // ========== 修复天数计算 ==========
        function calcDay() {
            const start = new Date(startYear, startMonth - 1, startDay);
            const now = new Date();
            const diffMs = now - start;
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            if(diffDays < 0){
                document.getElementById("count").innerText = "日期设置错误";
            }else{
                document.getElementById("count").innerText = `❤️ ${diffDays} 天`;
            }
        }
        calcDay();
        function renderGallery(filterKey){
            const galleryBox = document.getElementById('galleryBox');
            galleryBox.innerHTML = "";
            let showList = filterKey === "all" ? [...photoData] : photoData.filter(p=> p.tags.includes(filterKey));
            showList.forEach((photo,idx)=>{
                const itemDiv = document.createElement('div');
                itemDiv.className = 'gallery-item';
                const t1 = document.createElement('span');
                t1.className="dec dec-tl";
                t1.innerText = sweetEmojis[(idx+0) % sweetEmojis.length];
                const t2 = document.createElement('span');
                t2.className="dec dec-tr";
                t2.innerText = sweetEmojis[(idx+2) % sweetEmojis.length];
                const b1 = document.createElement('span');
                b1.className="dec dec-bl";
                b1.innerText = sweetEmojis[(idx+1) % sweetEmojis.length];
                const b2 = document.createElement('span');
                b2.className="dec dec-br";
                b2.innerText = sweetEmojis[(idx+3) % sweetEmojis.length];
                const img = document.createElement('img');
                img.src = photo.src;
                img.alt = "合照";
                //图片加载失败容错
                img.onerror = function(){
                    this.src = "https://picsum.photos/id/237/400/300";

        //解析LRC
        function parseLrc(text){
            const lines = text.split(/\r?\n/);
            const result = [];
            const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
            for(let line of lines){
                const match = line.match(timeReg);
                if(!match) continue;
                const min = parseInt(match[1]);
                const sec = parseInt(match[2]);
                const ms = parseInt(match[3]);
                const time = min*60 + sec + ms / 1000;
                let txt = line.replace(timeReg,"").trim();
                result.push({time,text:txt});
            }
            result.sort((a,b)=>a.time - b.time);
            return result;
        }
        async function loadLyric(lrcFileName){
            lyricLines = [];
            singleLyricDom.innerText = "加载歌词…";
            if(!lrcFileName || lrcFileName.trim()===""){
                singleLyricDom.innerText = "暂无歌词";
                return;
            }
            try{
                const resp = await fetch("music/"+lrcFileName);
                if(!resp.ok) throw new Error("not found");
                const lrcText = await resp.text();
                lyricLines = parseLrc(lrcText);
                if(lyricLines.length ===0){
                    singleLyricDom.innerText="暂无歌词";
                }else{
                    singleLyricDom.innerText = lyricLines[0].text || "等待播放";
                }
            }catch(err){
                singleLyricDom.innerText = "歌词加载失败";
            }
        }
        // 歌词校准：按歌曲独立生效（在 loadSong 中切换）
        let activeLrcOffset = 0.5;
        let activeLrcScale = 1;
        function updateSingleLyric(currentTime){
            if(lyricLines.length===0) return;
            const t = currentTime * activeLrcScale + activeLrcOffset;
            let activeIndex = 0;
            for(let i=0;i<lyricLines.length;i++){
                if(t >= lyricLines[i].time){
                    activeIndex = i;
                }else break;
            }
            singleLyricDom.innerText = lyricLines[activeIndex].text;
        }

            e.stopPropagation();

            resizeStartH = audioPanel.offsetHeight;

            if(isDragMove){
                let x = e.clientX - dragOffsetX;

                const w = audioPanel.offsetWidth;
                const h = audioPanel.offsetHeight;
                x = Math.max(0, Math.min(window.innerWidth - w, x));
                y = Math.max(0, Math.min(window.innerHeight - h, y));
                audioPanel.style.left = x + "px";
                audioPanel.style.top = y + "px";

            if(isResize){

            }
        })
