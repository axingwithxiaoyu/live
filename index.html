<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的小世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            color: #7b4157;
            padding: 30px 15px;
            position: relative;
            min-height: 100vh;
        }
        /* 手机端预留顶部空间给音频面板 */
        @media (max-width: 600px){
            body{
                padding-top: 80px;
            }
            /* 放大缩放手柄，方便手指点按 */
            .resize-handle{
                width: 26px;
                height: 26px;
            }
        }
        /* ========== 淡粉梦幻星空渐变背景 ========== */
        .starry-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(140deg, #ffe8f0 0%, #ffd8e8 30%, #fce4f2 60%, #fff0f6 100%);
        }
        .star-dot {
            position: absolute;
            border-radius: 50%;
            background-color: #ffffff;
            opacity: 0.6;
            animation: twinkle 3s ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 0.9; transform: scale(1.1); }
        }
        .meteor-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .meteor {
            position: absolute;
            top: -10%;
            width: 2px;
            height: 80px;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, #fff 50%, rgba(255,255,255,0) 100%);
            filter: drop-shadow(0 0 8px #ffcce0);
            animation: meteor linear infinite;
            opacity: 0;
        }
        @keyframes meteor {
            0% {
                transform: translateY(-100px) translateX(0) rotate(210deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) translateX(-220px) rotate(210deg);
                opacity: 0;
            }
        }
        .petal-wrap{
            position: fixed;
            inset:0;
            z-index:-1;
            pointer-events:none;
            overflow:hidden;
        }
        .petal{
            position:absolute;
            top:-10%;
            width:14px;
            height:14px;
            background:#ffc8d8;
            border-radius: 0 50% 50% 50%;
            opacity:0.75;
            animation:petalFall linear infinite, petalRotate ease-in-out infinite;
        }
        @keyframes petalFall{
            0%{transform:translateX(0) translateY(-50px);opacity:0;}
            10%{opacity:0.8;}
            100%{transform:translateX(80px) translateY(110vh);opacity:0;}
        }
        @keyframes petalRotate{
            0%{transform:rotate(0deg);}
            100%{transform:rotate(360deg);}
        }
        .heart-follow{
            position:fixed;
            pointer-events:none;
            z-index:99;
            font-size:18px;
            color:#ff88aa;
            opacity:0;
            animation:heartFloat 1.2s ease-out forwards;
        }
        @keyframes heartFloat{
            0%{opacity:0.8; transform:translateY(0) scale(1);}
            100%{opacity:0; transform:translateY(-60px) scale(0.4);}
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 12px;
        }
        .tip {
            font-size: 16px;
            color: #b0748c;
            margin-bottom: 20px;
        }
        .count-box {
            display: inline-block;
            background: #ffe6ee;
            padding: 16px 28px;
            border-radius: 999px;
            font-size: 20px;
        }
        .tab-wrap{
            display:flex;
            gap:12px;
            flex-wrap:wrap;
            justify-content:center;
            margin-bottom:30px;
        }
        .tab-btn{
            padding:8px 20px;
            border-radius:30px;
            border:2px solid #ffc8d8;
            background:#fff;
            color:#7b4157;
            cursor:pointer;
            font-size:16px;
            transition:0.2s;
        }
        .tab-btn.active{
            background:#ff88aa;
            color:#fff;
            border-color:#ff88aa;
        }
        .tab-btn:hover:not(.active){
            background:#ffe6ee;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom:50px;
        }
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            background: #fff;
            padding: 2px;
            background-image: linear-gradient(135deg,#ffd6e4,#ffe8ef,#ffd6e4);
            box-shadow: 0 4px 14px rgba(123, 65, 87, 0.08);
            cursor: pointer;
            min-height: 200px;
        }
        .gallery-item::before {
            content: "";
            display: block;
            background: #fff;
            border-radius: 14px;
            position: absolute;
            inset: 2px;
            z-index: 0;
        }
        .gallery-item > * {
            position: relative;
            z-index: 1;
        }
        .gallery-item img {
            width: calc(100% - 16px);
            height: 200px;
            object-fit: cover;
            border-radius:10px;
            margin: 8px;
            transition: transform 0.4s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.03);
        }
        .gallery-item .dec {
            position:absolute;
            font-size:20px;
            opacity:0.5;
            pointer-events:none;
            z-index:2;
            animation:decFloat 4s ease-in-out infinite alternate;
        }
        @keyframes decFloat {
            0%{transform:translateY(0px);}
            100%{transform:translateY(-3px);}
        }
        .dec-tl { top:6px; left:8px; }
        .dec-tr { top:6px; right:8px; }
        .dec-bl { bottom:6px; left:8px; }
        .dec-br { bottom:6px; right:8px; }
        .note-wall{
            margin:60px 0;
        }
        .block-title{
            text-align:center;
            font-size:24px;
            margin-bottom:32px;
            color:#7b4157;
        }
        .note-input-area{
            max-width:600px;
            margin:0 auto 30px;
            background:#fff;
            padding:20px;
            border-radius:14px;
            box-shadow:0 3px 12px rgba(123, 65, 87, 0.08);
        }
        #noteTextarea{
            width:100%;
            min-height:80px;
            padding:12px;
            border:1px solid #ffd6e4;
            border-radius:8px;
            resize:vertical;
            font-size:15px;
        }
        .note-mode-tip{
            margin-top:10px;
            font-size:12px;
            color:#c2889f;
            text-align:center;
        }
        .upload-section{
            max-width:600px;
            margin:0 auto 30px;
        }
        .upload-panel{
            background:#fff;
            border-radius:14px;
            box-shadow:0 3px 12px rgba(123,65,87,0.08);
            padding:14px 20px;
        }
        .upload-panel summary{
            cursor:pointer;
            font-size:16px;
            color:#7b4157;
            font-weight:bold;
        }
        .upload-body{
            margin-top:14px;
            display:flex;
            flex-direction:column;
            gap:14px;
        }
        .upload-row{
            display:flex;
            flex-direction:column;
            gap:8px;
        }
        .upload-row label{
            font-size:14px;
            color:#b0748c;
        }
        .upload-row button{
            align-self:flex-start;
            padding:8px 20px;
            background:#ff88aa;
            color:#fff;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:14px;
        }
        .upload-row button:disabled{
            opacity:0.5;
        }
        .upload-manage{
            margin-top:4px;
            border-top:1px dashed #ffd6e4;
            padding-top:12px;
        }
        .manage-title{
            font-size:14px;
            color:#b0748c;
            margin-bottom:10px;
        }
        .manage-grid{
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(84px, 1fr));
            gap:8px;
            margin-bottom:10px;
        }
        .manage-item{
            position:relative;
            border-radius:8px;
            overflow:hidden;
            background:#fff0f6;
        }
        .manage-item img{
            width:100%;
            height:64px;
            object-fit:cover;
            display:block;
        }
        .manage-del{
            position:absolute;
            top:3px;
            right:3px;
            width:20px;
            height:20px;
            border:none;
            border-radius:50%;
            background:rgba(255,255,255,0.92);
            color:#e0557f;
            cursor:pointer;
            font-size:12px;
            line-height:18px;
            padding:0;
        }
        .manage-del:disabled{
            opacity:0.4;
        }
        .manage-del-inline{
            position:static;
            flex:none;
        }
        .manage-list{
            display:flex;
            flex-direction:column;
            gap:6px;
        }
        .manage-song{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:8px;
            font-size:13px;
            color:#7b4157;
            padding:6px 10px;
            border-radius:8px;
            background:#fff0f6;
        }
        .ms-name{
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
        }
        .note-btn-row{
            margin-top:12px;
            text-align:right;
        }
        #addNoteBtn{
            padding:8px 22px;
            background:#ff88aa;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:15px;
        }
        #addNoteBtn:hover{
            background:#ff6b98;
        }
        .note-container{
            display:flex;
            flex-wrap:wrap;
            gap:18px;
            justify-content:center;
        }
        .note{
            width:180px;
            padding:16px 14px;
            border-radius:6px;
            box-shadow:2px 3px 8px rgba(0,0,0,0.12);
            transform:rotate(var(--r));
            transition:transform 0.25s ease;
            cursor:default;
            position:relative;
        }
        .note:hover{
            transform:rotate(0deg) scale(1.05);
            z-index:2;
        }
        .note-del{
            position:absolute;
            top:4px;
            right:6px;
            font-size:14px;
            cursor:pointer;
            opacity:0.4;
        }
        .note:hover .note-del{
            opacity:1;
        }
        .note-1{background:#fff8bc; --r:-2deg;}
        .note-2{background:#ffddee; --r:2deg;}
        .note-3{background:#dcf6ff; --r:-1.5deg;}
        .note-4{background:#ffe9cc; --r:1.8deg;}
        .note-text{
            font-size:15px;
            line-height:1.6;
        }
        .words {
            margin-top: 40px;
            padding: 24px;
            background: #fff;
            border-radius: 16px;
            line-height: 1.8;
            font-size: 17px;
        }
        footer {
            margin-top: 40px;
            text-align: center;
            color: #c2889f;
        }

        /* =========音频面板【支持两种模式切换 + 缩放手柄】========= */
        .audio-panel{
            position: fixed;
            top:20px;
            right:20px;
            background:#ffe6ee;
            padding:14px 16px;
            border-radius:18px;
            box-shadow:0 3px 8px rgba(0,0,0,0.1);
            z-index:10;
            display:flex;
            flex-direction:column;
            gap:12px;
            transition: all 0.4s ease;
            cursor:move;
            user-select:none;
            touch-action:none;
        }
        /*右下角缩放手柄*/
        .resize-handle{
            position:absolute;
            width:16px;
            height:16px;
            right:0;
            bottom:0;
            border-radius:0 0 18px 0;
            cursor:se-resize;
            background:rgba(255,136,170,0.25);
        }
        /* 重置按钮（右上角） */
        .reset-icon{
            position:absolute;
            top:1px;
            right:1px;
            width:16px;
            height:16px;
            font-size:9px;
            border-radius:50%;
            opacity:0;
            background:#fff;
            transition: opacity 0.2s ease;
        }
        .audio-panel:hover .reset-icon{
            opacity:0.7;
        }
        .reset-icon:hover{
            opacity:1 !important;
            background:#ffd6e4;
        }
        /* 恢复默认适配按钮（右上角，重置大小/位置/行数，保留当前模式） */
        .adapt-icon{
            position:absolute;
            top:1px;
            right:18px;
            width:16px;
            height:16px;
            font-size:9px;
            border-radius:50%;
            opacity:0;
            background:#fff;
            transition: opacity 0.2s ease;
            z-index:8;
        }
        .audio-panel:hover .adapt-icon{
            opacity:0.7;
        }
        .adapt-icon:hover{
            opacity:1 !important;
            background:#ffd6e4;
        }
        /* 歌词条模式：恢复按钮默认隐藏，点击浮现控制行时一起出现 */
        .audio-panel.lyric-bar-mode .adapt-icon{
            opacity:0;
            pointer-events:none;
        }
        .audio-panel.lyric-bar-mode .bar-controls.show ~ .adapt-icon{
            opacity:0.7;
            pointer-events:auto;
        }

        /* ====== QQ音乐桌面歌词长条模式（PC+手机全部可用） ====== */
        .audio-panel.lyric-bar-mode{
            flex-direction:row;
            align-items:center;
            width:480px;
            height:84px;
            padding:0 14px;
            background:rgba(255,230,238,0.55);
            backdrop-filter: blur(8px);
            gap:0;
        }
        /* 歌词条模式默认隐藏全部按钮，只留歌词（点击浮现控制行） */
        .audio-panel.lyric-bar-mode .btn-row,
        .audio-panel.lyric-bar-mode .volume-wrap,
        .audio-panel.lyric-bar-mode .reset-icon{
            display:none;
        }
        /* 两行歌词显示区（默认隐藏，长条模式才显示） */
        .single-lyric-text{
            display:none;
        }
        .audio-panel.lyric-bar-mode .single-lyric-text{
            display:flex;
            flex:1;
            min-width:0;
            flex-direction:column;
            justify-content:center;
            gap:2px;
            overflow:hidden;
            text-align:center;
            cursor:pointer;
        }
        .lyric-line{
            font-size:15px;
            line-height:1.35;
            color:#a87389;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }
        /* 上排：正在播放的句子（高亮） */
        .lyric-line.lyric-prev{
            font-size:18px;
            color:#e0447f;
            font-weight:bold;
        }
        /* 悬浮窗高度不足时自动缩减为一行 */
        .audio-panel.lyric-bar-mode.one-line .lyric-prev{
            display:none;
        }
        /* 第三行歌词：默认隐藏，拖高到 110px 以上自动出现 */
        .lyric-next2{
            display:none;
        }
        .audio-panel.lyric-bar-mode.three-line .lyric-next2{
            display:block;
        }
        /* 歌词切换时的上滑滚动动画 */
        .audio-panel.lyric-bar-mode .single-lyric-text.slide .lyric-line{
            animation: lyricSlide .35s ease;
        }
        @keyframes lyricSlide{
            from{ transform:translateY(12px); opacity:.1; }
            to{ transform:translateY(0); opacity:1; }
        }
        /* 点击歌词条后浮现的控制行（3秒无操作自动隐藏） */
        .bar-controls{
            position:absolute;
            inset:0;
            display:none;
            align-items:center;
            justify-content:center;
            gap:16px;
            background:rgba(255,230,238,0.92);
            border-radius:inherit;
            z-index:6;
        }
        .bar-controls.show{
            display:flex;
        }
        .bar-controls .audio-icon{
            width:34px;
            height:34px;
            font-size:14px;
        }
        .bar-controls .play-main{
            width:40px;
            height:40px;
        }
        /* 播放列表弹层 */
        .playlist-pop{
            position:absolute;
            right:0;
            width:230px;
            max-height:300px;
            overflow-y:auto;
            background:#fff;
            border-radius:12px;
            box-shadow:0 6px 24px rgba(123,65,87,.28);
            padding:8px;
            display:none;
            z-index:60;
        }
        .playlist-pop.show{
            display:block;
        }
        .playlist-pop .pl-item{
            padding:9px 12px;
            border-radius:8px;
            font-size:14px;
            color:#7b4157;
            cursor:pointer;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:8px;
        }
        .playlist-pop .pl-item:hover{
            background:#ffe6ee;
        }
        .playlist-pop .pl-item.active{
            background:#ff88aa;
            color:#fff;
        }
        .playlist-pop .pl-tag{
            font-size:11px;
            opacity:.75;
            flex:none;
        }
        /* 手机端音频面板适配 */
        @media (max-width: 600px){
            .audio-panel.lyric-bar-mode{
                max-width: calc(100vw - 40px);
            }
            .lyric-line{
                font-size:14px;
            }
            .lyric-line.lyric-cur{
                font-size:16px;
            }
        }

        .btn-row{
            display:flex;
            gap:10px;
            align-items:center;
            justify-content:center;
        }
        .audio-icon{
            width:36px;
            height:36px;
            border:none;
            border-radius:50%;
            background:#ffffff;
            color:#7b4157;
            font-size:16px;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            box-shadow:0 2px 5px rgba(0,0,0,0.06);
        }
        .audio-icon:hover{
            background:#f8d2e0;
        }
        .play-main{
            width:42px;
            height:42px;
            background:#ff78a2;
            color:#fff;
        }
        .play-main:hover{
            background:#ff588c;
        }
        /*第二排：音量+词按钮，整行居中对齐，缩短音量滑块长度*/
        .volume-wrap{
            display:flex;
            align-items:center;
            gap:8px;
            justify-content:center;
        }
        .volume-wrap input{
            width:80px;
        }
        #lyricToggleBtn{
            width:28px;
            height:28px;
            font-size:13px;
        }

        .lightbox{
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.85);
            z-index:999;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        .lightbox.show{
            display:flex;
        }
        .lightbox img{
            max-width:90%;
            max-height:90vh;
            border-radius:12px;
            animation:fade 0.35s ease;
        }
        @keyframes fade{
            from{opacity:0;transform:scale(0.92)}
            to{opacity:1;transform:scale(1)}
        }
        .lightbox-close{
            position:absolute;
            top:24px;
            right:30px;
            color:white;
            font-size:36px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="starry-bg" id="starryBg"></div>
    <div class="meteor-bg" id="meteorBg"></div>
    <div class="petal-wrap" id="petalWrap"></div>
    <div class="container">
        <div class="header">
            <h1>💌 我们的回忆相册</h1>
            <div class="tip">从相爱那天起，已经一起走过</div>
            <div class="count-box" id="count">计算中...</div>
        </div>
        <div class="tab-wrap" id="tabWrap">
            <button class="tab-btn active" data-filter="all">全部</button>
            <button class="tab-btn" data-filter="我的世界">我的世界</button>
            <button class="tab-btn" data-filter="第五人格">第五人格</button>
            <button class="tab-btn" data-filter="其他">其他</button>
            <button class="tab-btn" data-filter="上传">我们的上传</button>
        </div>
        <div class="gallery" id="galleryBox"></div>
        <section class="note-wall">
            <h2 class="block-title">💛 留言墙</h2>
            <div class="note-input-area">
                <textarea id="noteTextarea" placeholder="写下你想对TA说的话…"></textarea>
                <div class="note-btn-row">
                    <button id="addNoteBtn">添加留言</button>
                </div>
                <div id="noteModeTip" class="note-mode-tip">留言服务连接中…</div>
            </div>
            <div class="note-container" id="noteBox"></div>
        </section>
        <section class="upload-section">
            <details class="upload-panel">
                <summary>📁 我们的上传（照片 / 音乐）</summary>
                <div class="upload-body">
                    <div class="upload-row">
                        <label>📸 上传照片（可多选，自动加入照片墙）</label>
                        <input type="file" id="photoFiles" accept="image/*" multiple>
                        <button id="uploadPhotoBtn">上传照片</button>
                    </div>
                    <div class="upload-row">
                        <label>🎵 上传歌曲（mp3 必选，同名 .lrc 可选）</label>
                        <input type="file" id="songFile" accept=".mp3,audio/mpeg">
                        <input type="file" id="lrcFile" accept=".lrc,text/plain">
                        <button id="uploadSongBtn">上传歌曲</button>
                    </div>
                    <div class="upload-manage">
                        <div class="manage-title">🗂 已上传内容（点 ✕ 删除）</div>
                        <div id="managePhotos" class="manage-grid"></div>
                        <div id="manageSongs" class="manage-list"></div>
                    </div>
                    <div id="uploadTip" class="note-mode-tip"></div>
                </div>
            </details>
        </section>
        <div class="words">
            ✨ 写给我们：<br>
            很高兴和你相遇，
            所有细碎、温柔的瞬间，
            都值得好好收藏。
            往后日子，慢慢一起走。
        </div>
        <footer>
            Axing with Xiaoyu
        </footer>
    </div>
    <div class="lightbox" id="lightbox">

        // 大图压缩：超过 900KB 的照片在前端压成 1920px 内的 JPEG（同时绕开上传与显示环节的 1MB 限制）
        function compressImage(file){
            if(file.size <= 900 * 1024){ return Promise.resolve(file); }
            return new Promise(function(resolve){
                const url = URL.createObjectURL(file);
                const im = new Image();
                im.onload = function(){
                    URL.revokeObjectURL(url);
                    try{
                        const maxSide = 1920;
                        const scale = Math.min(1, maxSide / Math.max(im.naturalWidth, im.naturalHeight));
                        const canvas = document.createElement("canvas");
                        canvas.width = Math.max(1, Math.round(im.naturalWidth * scale));
                        canvas.height = Math.max(1, Math.round(im.naturalHeight * scale));
                        canvas.getContext("2d").drawImage(im, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob(function(blob){
                            if(blob && blob.size < file.size){
                                resolve(new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }));
                            }else{
                                resolve(file);
                            }
                        }, "image/jpeg", 0.85);
                    }catch(e){ resolve(file); }
                };
                im.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
                im.src = url;
            });
        }

        document.getElementById("uploadPhotoBtn").onclick = async function(){
            const input = document.getElementById("photoFiles");
            const tip = document.getElementById("uploadTip");
            const files = Array.prototype.slice.call(input.files || []).filter(f => f.size > 0);
            if(files.length === 0){ tip.textContent = "请先选择照片"; return; }
            const btn = this;
            btn.disabled = true;
            const saved = [];
            let failMsg = "";
            for(let i = 0; i < files.length; i++){
                const raw = files[i];
                const f = await compressImage(raw);
                if(f.size > 10 * 1024 * 1024){ failMsg = "「" + raw.name + "」超过10MB已跳过"; continue; }
                tip.textContent = "照片上传中 (" + (i + 1) + "/" + files.length + ")：" + raw.name;
                try{
                    // 直传三步：init 要地址 → 浏览器 PUT 直传 → finish 登记（绕开函数 1MB 请求体限制）
                    const type = (f.type && f.type.indexOf("image/") === 0) ? f.type : "image/jpeg";
                    const initRes = await fetch("api/photos?mode=init", { method:"POST", headers:{ "content-type": "application/json" }, body: JSON.stringify({ name: raw.name, size: f.size, type: type }) });
                    const init = await initRes.json();
                    if(!initRes.ok || !init.ok) throw new Error(init.error || initRes.status);
                    const putRes = await fetch(init.url, { method: "PUT", headers: { "Content-Type": type }, body: f });
                    if(!putRes.ok) throw new Error("直传失败" + putRes.status);
                    const finRes = await fetch("api/photos?mode=finish", { method:"POST", headers:{ "content-type": "application/json" }, body: JSON.stringify({ id: init.id, name: f.name, type: type }) });
                    const fin = await finRes.json();
                    if(!finRes.ok || !fin.ok || !fin.saved) throw new Error(fin.error || finRes.status);
                    saved.push(fin.saved);
                }catch(e){ failMsg = "「" + f.name + "」上传失败：" + (e.message || "网络错误"); }
            }
            if(saved.length > 0){
                for(const p of saved){ uploadedPhotos.push({src:"api/photos?id="+p.id, tags:["上传"]}); }
                renderGallery(currentFilter);
                renderManage();
                input.value = "";

            if(failMsg){ tip.textContent = failMsg + (saved.length > 0 ? "（其余 " + saved.length + " 张已成功）" : ""); }

        document.getElementById("uploadSongBtn").onclick = async function(){

            const f = sf.files[0];
            const btn = this;
            btn.disabled = true;
            try{
                // 分块直传：函数读不回 >1MB 的对象，所以把 mp3 切成 768KB 小块逐块上传，播放时按需拼接
                const CHUNK = 786432;
                const initRes = await fetch("api/songs?mode=init", { method:"POST", headers:{ "content-type": "application/json" }, body: JSON.stringify({ name: f.name, size: f.size }) });
                const init = await initRes.json();
                if(!initRes.ok || !init.ok || !Array.isArray(init.urls)) throw new Error(init.error || initRes.status);
                for(let i = 0; i < init.urls.length; i++){
                    tip.textContent = "歌曲上传中 (" + (i + 1) + "/" + init.urls.length + ")…请稍等";
                    const blob = f.slice(i * CHUNK, Math.min(f.size, (i + 1) * CHUNK));
                    const putRes = await fetch(init.urls[i], { method: "PUT", headers: { "Content-Type": "application/octet-stream" }, body: blob });
                    if(!putRes.ok) throw new Error("分块直传失败" + putRes.status);
                }
                let lrcText = null;

        //解析LRC
        function parseLrc(text){
            const lines = text.split(/\r?\n/);
            const result = [];
            const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
            for(let line of lines){
                const match = line.match(timeReg);
                if(!match) continue;
                const min = parseInt(match[1]);
                const sec = parseInt(match[2]);
                const ms = parseInt(match[3]);
                const time = min*60 + sec + ms / 1000;
                let txt = line.replace(timeReg,"").trim();
                result.push({time,text:txt});
            }
            result.sort((a,b)=>a.time - b.time);
            return result;
        }
        function setBarMsg(msg){
            lastLyricIdx = -1;
            // 上排=正在播放的句子（高亮），下面依次是下一句、下下句（暗色）
            lyricPrevDom.textContent = msg;
            lyricCurDom.textContent = "";
            lyricNext2Dom.textContent = "";
        }
        async function loadLyric(lrcFileName){
            lyricLines = [];
            setBarMsg("加载歌词…");
            if(!lrcFileName || lrcFileName.trim()===""){
                setBarMsg("暂无歌词");
                return;
            }
            try{
                const resp = await fetch(lrcFileName.indexOf("api/") === 0 ? lrcFileName : ("music/" + lrcFileName));
                if(!resp.ok) throw new Error("not found");
                const lrcText = await resp.text();
                lyricLines = parseLrc(lrcText);
                if(lyricLines.length ===0){
                    setBarMsg("暂无歌词");
                }else{
                    setBarMsg(lyricLines[0].text || "等待播放");
                }
            }catch(err){
                setBarMsg("歌词加载失败");
            }
        }
        // 歌词校准：按歌曲独立生效（在 loadSong 中切换）
        let activeLrcOffset = 0.5;
        let activeLrcScale = 1;
        let activeLrcCalib = null;
        // 分段校准：按锚点 [播放器秒, 歌词时间轴秒] 分段线性插值
        function calibTime(t){
            const c = activeLrcCalib;
            if(!c || c.length < 2) return t;
            if(t <= c[0][0]) return c[0][1] + (t - c[0][0]);
            for(let i=1;i<c.length;i++){
                if(t <= c[i][0]){
                    const dt = c[i][0] - c[i-1][0];
                    if(dt <= 0) return c[i][1];
                    return c[i-1][1] + (t - c[i-1][0]) * (c[i][1] - c[i-1][1]) / dt;
                }
            }
            const n = c.length, dt = c[n-1][0] - c[n-2][0];
            if(dt <= 0) return c[n-1][1];
            return c[n-1][1] + (t - c[n-1][0]) * (c[n-1][1] - c[n-2][1]) / dt;
        }
        function updateSingleLyric(currentTime){
            if(lyricLines.length===0) return;
            const t = calibTime(currentTime * activeLrcScale + activeLrcOffset);
            let activeIndex = 0;
            for(let i=0;i<lyricLines.length;i++){
                if(t >= lyricLines[i].time){
                    activeIndex = i;
                }else break;
            }
            if(activeIndex === lastLyricIdx) return;
            lastLyricIdx = activeIndex;
            // 双行/三行：上排=正在播放（高亮），下面依次显示下一句、下下句（暗色），换句时整体上滑
            lyricPrevDom.textContent = lyricLines[activeIndex].text || " ";
            lyricCurDom.textContent = activeIndex + 1 < lyricLines.length ? (lyricLines[activeIndex + 1].text || " ") : " ";
            lyricNext2Dom.textContent = activeIndex + 2 < lyricLines.length ? (lyricLines[activeIndex + 2].text || " ") : " ";
            singleLyricDom.classList.remove("slide");
            void singleLyricDom.offsetWidth;
            singleLyricDom.classList.add("slide");
        }
